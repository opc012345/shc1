<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 차량 입문 등록</title>
  
  <!-- PWA 기본 메타태그 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="입문등록">
  
  <!-- SHC 원형 로고 아이콘 -->
  <link rel="apple-touch-icon" id="app-icon-apple" href="">
  <link rel="icon" id="app-icon-fav" href="">

  <!-- 동적 PWA Manifest 및 상단 알림 방지용 Blob Service Worker 스크립트 -->
  <script>
    const shcLogoSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><circle cx="256" cy="256" r="256" fill="#dc2626"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-style="italic" font-size="190">SHC</text></svg>`;
    const logoBlob = new Blob([shcLogoSvg], { type: 'image/svg+xml' });
    const logoUrl = URL.createObjectURL(logoBlob);

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('app-icon-apple').href = logoUrl;
      document.getElementById('app-icon-fav').href = logoUrl;
    });

    const manifest = {
      name: "신흥정밀 차량 입문 등록",
      short_name: "입문등록",
      start_url: "./index.html?mode=pwa",
      display: "standalone",
      background_color: "#ffffff",
      theme_color: "#dc2626",
      icons: [{
        src: logoUrl,
        sizes: "512x512",
        type: "image/svg+xml",
        purpose: "any maskable"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);

    // 상단 알림을 유발하는 sw.js 호출 대신 Blob 방식 임시 서비스 워커 적용
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request)); });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW register failed:', err));
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center border border-slate-200">
    <div class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center font-black text-white text-xl tracking-tighter italic shadow-lg mx-auto mb-4">
      SHC
    </div>
    <h1 class="text-2xl font-black text-slate-800 mb-2">신흥정밀 차량 입문 등록</h1>
    <p class="text-sm text-slate-500 mb-6">방문하신 차량 정보를 입력해 주세요.</p>

    <!-- 입문 등록 폼 -->
    <form id="entry-form" onsubmit="handleFormSubmit(event)" class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">차량 번호</label>
        <input type="text" id="car_number" required placeholder="예: 12가 3456" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none text-slate-800 font-bold">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">운전자 성함</label>
        <input type="text" id="driver_name" required placeholder="성함을 입력하세요" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none text-slate-800 font-bold">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">연락처</label>
        <input type="tel" id="phone_number" required placeholder="010-0000-0000" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none text-slate-800 font-bold">
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-xl shadow-lg transition-all text-lg mt-2">
        입문 등록 신청
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = '등록 중...';

      const car_number = document.getElementById('car_number').value.trim();
      const driver_name = document.getElementById('driver_name').value.trim();
      const phone_number = document.getElementById('phone_number').value.trim();

      const { error } = await _supabase
        .from('dock_control')
        .insert([{ car_number, driver_name, phone_number, status: '대기중' }]);

      if (error) {
        alert('등록 실패: ' + error.message);
        btn.disabled = false;
        btn.innerText = '입문 등록 신청';
      } else {
        alert('입문 등록이 완료되었습니다.');
        document.getElementById('entry-form').reset();
        btn.disabled = false;
        btn.innerText = '입문 등록 신청';
      }
    }
  </script>
</body>
</html>
