<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 입문 등록</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between font-sans select-none">

  <!-- 헤더 -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-xl">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center font-black text-white text-sm tracking-tighter italic shadow-md border-2 border-red-500/50">
        SHC
      </div>
      <h1 class="text-xl font-black tracking-tight text-white">신흥정밀 입문 등록</h1>
    </div>
  </header>

  <!-- 메인 폼 영역 -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl backdrop-blur-md">
      
      <div class="text-center mb-6">
        <h2 class="text-2xl font-black text-slate-100 mb-2">차량 입문 신청</h2>
        <p class="text-xs text-slate-400">도착하신 기사님께서는 차량 및 인적사항을 입력해주세요.</p>
      </div>

      <form id="driver-form" onsubmit="handleSubmit(event)" class="space-y-4">
        <!-- 차량번호 입력 -->
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">차량 번호 <span class="text-red-500">*</span></label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
              <i class="fa-solid fa-truck"></i>
            </span>
            <input type="text" id="car-number" required placeholder="예: 12가 3456" 
              class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-amber-400 font-bold placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-all">
          </div>
        </div>

        <!-- 성함 입력 -->
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">운전자 성함 <span class="text-red-500">*</span></label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" id="driver-name" required placeholder="성함을 입력하세요" 
              class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-white font-bold placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-all">
          </div>
        </div>

        <!-- 연락처 입력 -->
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">연락처 <span class="text-red-500">*</span></label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
              <i class="fa-solid fa-phone"></i>
            </span>
            <input type="tel" id="phone-number" required placeholder="010-0000-0000" 
              class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-white font-bold placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-all">
          </div>
        </div>

        <!-- 제출 버튼 -->
        <button type="submit" id="submit-btn" 
          class="w-full mt-6 bg-amber-500 hover:bg-amber-400 active:scale-[0.98] text-slate-950 font-black py-4 rounded-xl shadow-lg shadow-amber-500/20 text-lg flex items-center justify-center gap-2 transition-all cursor-pointer">
          <i class="fa-solid fa-paper-plane"></i> 입문 신청하기
        </button>
      </form>

    </div>
  </main>

  <!-- 푸터 -->
  <footer class="py-4 text-center text-xs text-slate-600 border-t border-slate-900">
    © SHINHEUNG PRECISION CO., LTD. All rights reserved.
  </footer>

  <!-- Complete Modal -->
  <div id="complete-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
      <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border border-emerald-500/20">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h3 class="text-xl font-black text-white mb-2">접수가 완료되었습니다</h3>
      <p class="text-xs text-slate-400 mb-6">현황판을 확인하시고 안내에 따라 대기해 주시기 바랍니다.</p>
      <button onclick="location.reload()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-all">
        확인
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i';

    let _supabase = null;

    window.onload = () => {
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    };

    async function handleSubmit(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const carNumber = document.getElementById('car-number').value.trim();
      const driverName = document.getElementById('driver-name').value.trim();
      const phoneNumber = document.getElementById('phone-number').value.trim();

      if (!carNumber || !driverName || !phoneNumber) {
        alert('모든 필수 항목을 입력해주세요.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 접수 중...`;

      try {
        const { error } = await _supabase
          .from('dock_control')
          .insert([
            {
              car_number: carNumber,
              driver_name: driverName,
              phone_number: phoneNumber,
              status: '대기중'
            }
          ]);

        if (error) throw error;

        document.getElementById('complete-modal').classList.remove('hidden');

      } catch (err) {
        alert('접수 처리 중 오류가 발생했습니다: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 입문 신청하기`;
      }
    }
  </script>
</body>
</html>
