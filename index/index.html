<script>
    var SUPABASE_URL = "https://hlhjmnsgqhysvilltfpf.supabase.co";
    var SUPABASE_KEY = "sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i";
    var _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var currentCancelTargetId = null;
    var currentCancelTargetPhone = null;

    /* PWA 앱 설치 지원 제어 */
    var deferredPrompt = null;
    var pwaBanner = document.getElementById('pwaBanner');
    var btnPwaInstall = document.getElementById('btnPwaInstall');

    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

    if (!isStandalone) {
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        if (pwaBanner) {
          pwaBanner.classList.add('show');
        }
      });

      if (isIOS) {
        if (pwaBanner) {
          pwaBanner.classList.add('show');
          btnPwaInstall.innerHTML = '<i class="fa-solid fa-arrow-up-from-bracket"></i> [홈 화면에 추가] 방법 보기';
          btnPwaInstall.onclick = function() {
            alert("아이폰(Safari) 설치 방법:\n1. 화면 하단 중앙 [공유] 버튼 클릭\n2. [홈 화면에 추가] 선택");
          };
        }
      }

      if (btnPwaInstall && !isIOS) {
        btnPwaInstall.addEventListener('click', async function() {
          if (!deferredPrompt) {
            alert("이미 앱이 설치되어 있거나 브라우저 환경상 자동 설치를 지원하지 않습니다.");
            return;
          }
          deferredPrompt.prompt();
          var choiceResult = await deferredPrompt.userChoice;
          if (choiceResult.outcome === 'accepted') {
            pwaBanner.classList.remove('show');
          }
          deferredPrompt = null;
        });
      }
    }

    window.addEventListener('appinstalled', function() {
      if (pwaBanner) pwaBanner.classList.remove('show');
    });

    window.onload = function() {
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      var isAppMode = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
      var manualBtn = document.getElementById('manualInstallBtn');
      
      if (isMobile && !isAppMode && manualBtn) {
        manualBtn.style.display = 'flex';
      }

      var savedCar = localStorage.getItem('shc_car');
      var savedName = localStorage.getItem('shc_name');
      var savedPhone = localStorage.getItem('shc_phone');

      if (savedCar) document.getElementById('carNumber').value = savedCar;
      if (savedName) document.getElementById('driverName').value = savedName;
      if (savedPhone) document.getElementById('phoneNumber').value = savedPhone;

      loadMyStatus();
    };

    function formatCarInput(input) {
      input.value = input.value.replace(/\s+/g, '');
    }

    function formatNameInput(input) {
      input.value = input.value.replace(/\s+/g, '');
    }

    function formatPhoneInput(input) {
      var val = input.value.replace(/[^0-9]/g, '');
      if (val.length < 4) {
        input.value = val;
      } else if (val.length < 7) {
        input.value = val.substr(0, 3) + '-' + val.substr(3);
      } else if (val.length < 11) {
        input.value = val.substr(0, 3) + '-' + val.substr(3, 3) + '-' + val.substr(6);
      } else {
        input.value = val.substr(0, 3) + '-' + val.substr(3, 4) + '-' + val.substr(7, 4);
      }
    }

    function toggleAccordion() {
      var content = document.getElementById('accordionContent');
      var icon = document.getElementById('accordionIcon');
      content.classList.toggle('show');
      icon.className = content.classList.contains('show') ? "fa-solid fa-chevron-up" : "fa-solid fa-chevron-down";
    }

    function openMapModal() {
      document.getElementById('mapModal').classList.add('show');
    }
    function closeMapModal() {
      document.getElementById('mapModal').classList.remove('show');
    }

    function clearInput(id) {
      document.getElementById(id).value = '';
      loadMyStatus();
    }

    document.getElementById('dockForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      var carNumber = document.getElementById('carNumber').value.replace(/\s+/g, '').trim();
      var driverName = document.getElementById('driverName').value.replace(/\s+/g, '').trim();
      var phoneNumber = document.getElementById('phoneNumber').value.trim();
      var remember = document.getElementById('rememberInfo').checked;

      if (remember) {
        localStorage.setItem('shc_car', carNumber);
        localStorage.setItem('shc_name', driverName);
        localStorage.setItem('shc_phone', phoneNumber);
      } else {
        localStorage.removeItem('shc_car');
        localStorage.removeItem('shc_name');
        localStorage.removeItem('shc_phone');
      }

      var btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 전송 중...';

      var res = await _supabase
        .from('dock_control')
        .insert([{ 
          car_number: carNumber, 
          driver_name: driverName, 
          phone_number: phoneNumber, 
          status: '대기중'
        }]);

      if (res.error) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 차량 입문 등록';
        alert('입문 등록 전송 중 오류가 발생했습니다: ' + res.error.message);
        return;
      }

      var MAKE_WEBHOOK_URL = "https://hook.eu1.make.com/p9fo8ttydfxqgmg9w2qdjttkf60prcge";

      try {
        await fetch(MAKE_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            car_number: carNumber,
            driver_name: driverName,
            phone_number: phoneNumber,
            timestamp: new Date().toISOString()
          })
        });
      } catch (tgError) {
        console.error("웹훅 전송 실패:", tgError);
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 차량 입문 등록';
      alert('차량 입문 등록이 정상적으로 전송되었습니다.');
      loadMyStatus();
    });

    /* XSS 방지를 위한 이스케이프 함수 */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* 🔄 [보완 완료] XSS 방지 및 안전한 데이터 렌더링 적용 (UI 디자인 유지) */
    async function loadMyStatus() {
      var container = document.getElementById('historyList');
      var now = new Date();
      document.getElementById('lastCheckTime').innerText = "최종 확인: " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      var inputCar = document.getElementById('carNumber').value.replace(/\s+/g, '').trim();
      var inputPhone = document.getElementById('phoneNumber').value.trim();

      if (!inputCar || !inputPhone) {
        container.innerHTML = '<div class="empty-msg">오늘 접수된 내 알림 내역이 없습니다.</div>';
        return;
      }

      var todayStart = new Date();
      todayStart.setHours(0, 0, 0, 0);

      var res = await _supabase.rpc('get_driver_entries', {
        p_car_number: inputCar,
        p_phone_number: inputPhone,
        p_today_start: todayStart.toISOString()
      });

      if (res.error || !res.data || res.data.length === 0) {
        container.innerHTML = '<div class="empty-msg">오늘 접수된 내 알림 내역이 없습니다.</div>';
        return;
      }

      container.innerHTML = '';

      res.data.forEach(function(item) {
        var dt = new Date(item.created_at);
        var timeStr = dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        var status = item.status || '대기중';
        var badgeClass = 'badge-wait';
        if (status === '출차완료') badgeClass = 'badge-done';
        if (status === '입문취소') badgeClass = 'badge-cancel';

        var maskedName = maskName(item.driver_name);
        var maskedPhone = maskPhone(item.phone_number);

        var actionBtnHtml = '<span style="color:#94a3b8; font-size:12px; font-weight:600;">처리완료</span>';
        if (status === '대기중') {
          actionBtnHtml = '<button class="btn-cancel cancel-action-btn" data-id="' + escapeHtml(item.id) + '" data-phone="' + escapeHtml(item.phone_number) + '">취소</button>';
        }

        var card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = 
          '<div class="card-top">' +
            '<span class="card-time"><i class="fa-regular fa-clock" style="margin-right: 4px;"></i>' + escapeHtml(timeStr) + '</span>' +
            '<span class="badge-status ' + badgeClass + '">' + escapeHtml(status) + '</span>' +
          '</div>' +
          '<div class="card-body">' +
            '<div>' +
              '<div class="info-label">차량번호</div>' +
              '<div class="info-val-car">' + escapeHtml(item.car_number || '-') + '</div>' +
            '</div>' +
            '<div>' +
              '<div class="info-label">운전자 성함</div>' +
              '<div class="info-val-user">' + escapeHtml(maskedName) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="card-bottom">' +
            '<div class="card-phone"><i class="fa-solid fa-phone" style="color: #94a3b8; margin-right: 4px;"></i>' + escapeHtml(maskedPhone) + '</div>' +
            '<div>' + actionBtnHtml + '</div>' +
          '</div>';
        container.appendChild(card);
      });

      // 동적 생성된 취소 버튼에 안전한 이벤트 리스너 연결
      var cancelButtons = container.querySelectorAll('.cancel-action-btn');
      cancelButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var targetId = this.getAttribute('data-id');
          var targetPhone = this.getAttribute('data-phone');
          openCancelModal(targetId, targetPhone);
        });
      });
    }

    function maskName(name) {
      if (!name) return '-';
      if (name.length <= 2) return name.substring(0, 1) + '*';
      return name.substring(0, 1) + '*'.repeat(name.length - 2) + name.substring(name.length - 1);
    }

    function maskPhone(phone) {
      if (!phone) return '-';
      var clean = phone.replace(/[^0-9]/g, '');
      if (clean.length === 11) {
        return clean.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-****');
      } else if (clean.length === 10) {
        return clean.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-****');
      }
      return phone.substring(0, 7) + '-****';
    }

    function openCancelModal(id, phone) {
      currentCancelTargetId = id;
      currentCancelTargetPhone = phone;
      document.getElementById('cancelInput').value = '';
      document.getElementById('cancelModal').classList.add('show');
      document.getElementById('cancelInput').focus();
    }

    function closeCancelModal() {
      document.getElementById('cancelModal').classList.remove('show');
      currentCancelTargetId = null;
      currentCancelTargetPhone = null;
    }

    async function submitCancel() {
      var inputVal = document.getElementById('cancelInput').value.trim();
      if (!inputVal) {
        alert('연락처 뒤 4자리를 입력해주세요.');
        return;
      }

      var targetId = currentCancelTargetId;
      closeCancelModal();

      var res = await _supabase.rpc('cancel_driver_entry', {
        p_id: targetId,
        p_last_four: inputVal
      });

      if (res.error || res.data === false) {
        alert('취소 실패: 연락처 뒤 4자리가 일치하지 않거나 이미 처리된 항목입니다.');
      } else {
        alert('알림이 취소되었습니다.');
        loadMyStatus();
      }
    }

    setInterval(function() { loadMyStatus(); }, 10000);
  </script>
