<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량입문 관제 시스템 - 신흥정밀</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #f4f6f9; color: #333; }
    
    .top-nav { background-color: #0f172a; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: bold; }
    
    /* 동그란 SHC 로고 스타일 */
    .shc-logo {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: #c81e2b;
      color: white;
      font-weight: 900;
      font-size: 13px;
      font-style: italic;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      letter-spacing: -0.5px;
      box-shadow: 0 2px 6px rgba(200, 30, 43, 0.4);
    }
    
    .shc-logo-large {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: #c81e2b;
      color: white;
      font-weight: 900;
      font-size: 16px;
      font-style: italic;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      box-shadow: 0 3px 8px rgba(200, 30, 43, 0.3);
    }

    .badge-live { background: #ef4444; color: white; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: normal; margin-left: 6px; }
    .nav-right { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #94a3b8; }
    
    .btn-icon { background: #1e293b; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .btn-icon:hover { background: #334155; }

    /* 알림 ON 버튼 스타일 */
    .btn-notify-on {
      background: #10b981 !important;
      color: white !important;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }
    .btn-notify-on i {
      animation: ring 1.5s infinite;
    }
    @keyframes ring {
      0% { transform: rotate(0); }
      10% { transform: rotate(15deg); }
      20% { transform: rotate(-10deg); }
      30% { transform: rotate(10deg); }
      40% { transform: rotate(-5deg); }
      50% { transform: rotate(0); }
      100% { transform: rotate(0); }
    }

    #authBox { max-width: 360px; margin: 100px auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    #authBox input { padding: 12px; width: 100%; margin: 15px 0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; text-align: center; outline: none; }
    #authBox input:focus { border-color: #0f172a; }
    #authBox button { padding: 12px; width: 100%; background: #0f172a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; transition: background 0.2s; }
    #authBox button:hover { background: #1e293b; }

    #dashboard { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; }

    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; }
    .card-title { font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 8px; }
    .card-value { font-size: 28px; font-weight: 800; color: #0f172a; }
    .card-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; }
    .icon-blue { background: #eff6ff; color: #3b82f6; }
    .icon-orange { background: #fff7ed; color: #f97316; }
    .icon-green { background: #f0fdf4; color: #22c55e; }
    .icon-red { background: #fef2f2; color: #ef4444; }

    .panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; }
    .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .search-box { display: flex; align-items: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 12px; width: 300px; }
    .search-box input { border: none; background: transparent; margin-left: 8px; width: 100%; outline: none; font-size: 14px; }
    
    .status-tabs { display: flex; background: #f1f5f9; padding: 3px; border-radius: 6px; }
    .tab-btn { border: none; background: transparent; padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 4px; cursor: pointer; color: #64748b; }
    .tab-btn.active { background: #0f172a; color: white; }

    .action-group { display: flex; gap: 10px; }
    .date-input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .btn-excel { background: #059669; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f8fafc; color: #475569; font-size: 13px; font-weight: 700; padding: 14px; border-bottom: 2px solid #e2e8f0; }
    td { padding: 14px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #334155; }
    tbody tr:hover { background: #f8fafc; }

    .badge-status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .status-wait { background: #ffedd5; color: #c2410c; }
    .status-done { background: #dcfce7; color: #15803d; }
    .status-cancel { background: #fee2e2; color: #b91c1c; }

    .btn-action { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-action:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="brand">
      <span class="shc-logo">SHC</span>
      차량입문 관제 시스템
      <span class="badge-live">실시간</span>
    </div>
    <div class="nav-right">
      <span id="currentTime">2026. 00. 00 (월) 00:00:00</span>
      <button class="btn-icon" id="btnNotify" onclick="toggleNotifications()"><i class="fa-solid fa-bell-slash"></i> 알림 끄기 (Off)</button>
      <button class="btn-icon" onclick="loadData()"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </div>

  <div id="authBox">
    <div>
      <span class="shc-logo-large">SHC</span>
    </div>
    <h3 style="color: #0f172a; margin-bottom: 4px;">관제 시스템 접속</h3>
    <p style="font-size: 12px; color: #64748b; margin-bottom: 15px;">비밀번호 4자리를 입력해 주세요.</p>
    <input type="password" id="passcode" placeholder="비밀번호 입력" onkeyup="if(event.key==='Enter') checkAuth()">
    <button onclick="checkAuth()">접속하기</button>
  </div>

  <div id="dashboard">
    <div class="metrics-grid">
      <div class="card">
        <div>
          <div class="card-title">금일 총 입문</div>
          <div class="card-value" id="countTotal">0</div>
        </div>
        <div class="card-icon icon-blue"><i class="fa-solid fa-truck"></i></div>
      </div>
      <div class="card">
        <div>
          <div class="card-title" style="color: #f97316;">구역 내 대기중</div>
          <div class="card-value" id="countWait">0</div>
        </div>
        <div class="card-icon icon-orange"><i class="fa-solid fa-clock"></i></div>
      </div>
      <div class="card">
        <div>
          <div class="card-title" style="color: #22c55e;">출차 완료</div>
          <div class="card-value" id="countDone">0</div>
        </div>
        <div class="card-icon icon-green"><i class="fa-solid fa-check-circle"></i></div>
      </div>
      <div class="card">
        <div>
          <div class="card-title" style="color: #ef4444;">입문 취소</div>
          <div class="card-value" id="countCancel">0</div>
        </div>
        <div class="card-icon icon-red"><i class="fa-solid fa-ban"></i></div>
      </div>
    </div>

    <div class="panel">
      <div class="filter-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass" style="color: #94a3b8;"></i>
          <input type="text" id="searchInput" placeholder="차량번호 / 기사명 / 연락처 검색" onkeyup="filterData()">
        </div>

        <div class="status-tabs">
          <button class="tab-btn active" onclick="setFilterStatus('전체', this)">전체</button>
          <button class="tab-btn" onclick="setFilterStatus('대기중', this)">대기중</button>
          <button class="tab-btn" onclick="setFilterStatus('출차완료', this)">출차완료</button>
        </div>

        <div class="action-group">
          <input type="date" id="dateFilter" class="date-input" onchange="loadData()">
          <button class="btn-excel" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> 엑셀 다운로드</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>입문일시</th>
            <th>차량번호</th>
            <th>운전자 성함</th>
            <th>연락처</th>
            <th>상태</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="listTable">
          <tr><td colspan="6" style="text-align: center; color: #94a3b8;">데이터를 불러오는 중입니다...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://hlhjmnsgqhysvilltfpf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allData = [];
    let currentStatusFilter = '전체';
    let isNotificationOn = false;
    let lastRecordCount = -1;

    function updateClock() {
      const now = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const formatted = `${now.getFullYear()}. ${(now.getMonth()+1).toString().padStart(2,'0')}. ${now.getDate().toString().padStart(2,'0')} (${days[now.getDay()]}) ${now.toLocaleTimeString()}`;
      document.getElementById('currentTime').innerText = formatted;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 알림 토글 (On/Off)
    function toggleNotifications() {
      const btn = document.getElementById('btnNotify');

      if (!isNotificationOn) {
        // 알림 켜기 시도
        if ("Notification" in window) {
          Notification.requestPermission().then(permission => {
            isNotificationOn = true;
            btn.classList.add('btn-notify-on');
            btn.innerHTML = `<i class="fa-solid fa-bell"></i> 알림 켜짐 (On)`;
            if (permission !== "granted") {
              alert("윈도우 알림 권한이 거부되었지만 소리 알림은 작동합니다.");
            }
          });
        } else {
          isNotificationOn = true;
          btn.classList.add('btn-notify-on');
          btn.innerHTML = `<i class="fa-solid fa-bell"></i> 알림 켜짐 (On)`;
        }
      } else {
        // 알림 끄기
        isNotificationOn = false;
        btn.classList.remove('btn-notify-on');
        btn.innerHTML = `<i class="fa-solid fa-bell-slash"></i> 알림 끄기 (Off)`;
      }
    }

    // 비프음 재생
    function playBeep() {
      if (!isNotificationOn) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch(e){}
    }

    // 윈도우 데스크톱 알림 팝업
    function sendDesktopNotification(latestItem) {
      if (!isNotificationOn) return;
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("🚛 신규 차량 입문 신청!", {
          body: `차량번호: ${latestItem.car_number}\n운전자: ${latestItem.driver_name} (${latestItem.phone_number})`,
          icon: "https://opc012345.github.io/shc1/favicon.ico"
        });
      }
    }

    function checkAuth() {
      const pass = document.getElementById('passcode').value;
      if (pass === "1234") {
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        document.getElementById('dateFilter').value = new Date().toISOString().split('T')[0];
        loadData();
        setInterval(loadData, 5000);
      } else {
        alert('비밀번호가 올바르지 않습니다.');
      }
    }

    async function loadData() {
      const selectedDate = document.getElementById('dateFilter').value;
      
      let query = _supabase.from('dock_control').select('*').order('created_at', { ascending: false });
      
      if (selectedDate) {
        query = query.gte('created_at', `${selectedDate}T00:00:00`).lte('created_at', `${selectedDate}T23:59:59`);
      }

      const { data, error } = await query;

      if (error) {
        console.error(error);
        return;
      }

      // 신규 데이터 감지 시 알림 실행
      if (lastRecordCount !== -1 && data.length > lastRecordCount) {
        playBeep();
        if (data.length > 0) {
          sendDesktopNotification(data[0]);
        }
      }
      lastRecordCount = data.length;

      allData = data;
      updateMetrics();
      filterData();
    }

    function updateMetrics() {
      document.getElementById('countTotal').innerText = allData.length;
      document.getElementById('countWait').innerText = allData.filter(d => d.status === '대기중').length;
      document.getElementById('countDone').innerText = allData.filter(d => d.status === '출차완료').length;
      document.getElementById('countCancel').innerText = allData.filter(d => d.status === '입문취소').length;
    }

    function setFilterStatus(status, btn) {
      currentStatusFilter = status;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterData();
    }

    function filterData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = allData.filter(item => {
        const matchesStatus = (currentStatusFilter === '전체') || (item.status === currentStatusFilter);
        const matchesSearch = (item.car_number || '').toLowerCase().includes(search) ||
                              (item.driver_name || '').toLowerCase().includes(search) ||
                              (item.phone_number || '').toLowerCase().includes(search);
        return matchesStatus && matchesSearch;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('listTable');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 30px;">조회된 데이터가 없습니다.</td></tr>';
        return;
      }

      data.forEach(item => {
        const tr = document.createElement('tr');
        const inTime = new Date(item.created_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });

        let badgeClass = 'status-wait';
        if (item.status === '출차완료') badgeClass = 'status-done';
        if (item.status === '입문취소') badgeClass = 'status-cancel';

        tr.innerHTML = `
          <td>${inTime}</td>
          <td style="font-weight: bold;">${item.car_number}</td>
          <td>${item.driver_name}</td>
          <td>${item.phone_number}</td>
          <td><span class="badge-status ${badgeClass}">${item.status}</span></td>
          <td>
            ${item.status === '대기중' 
              ? `<button class="btn-action" onclick="completeDock(${item.id})">출차 완료</button>` 
              : '완료됨'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function completeDock(id) {
      const { error } = await _supabase
        .from('dock_control')
        .update({ status: '출차완료' })
        .eq('id', id);

      if (error) {
        alert('처리 실패: ' + error.message);
      } else {
        loadData();
      }
    }

    function exportToExcel() {
      if (allData.length === 0) {
        alert('다운로드할 데이터가 없습니다.');
        return;
      }
      const ws = XLSX.utils.json_to_sheet(allData.map(item => ({
        '신청시간': new Date(item.created_at).toLocaleString(),
        '차량번호': item.car_number,
        '운전자 성함': item.driver_name,
        '연락처': item.phone_number,
        '상태': item.status
      })));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "입문현황");
      XLSX.writeFile(wb, `도크_입문현황_${document.getElementById('dateFilter').value}.xlsx`);
    }
  </script>
</body>
</html>
