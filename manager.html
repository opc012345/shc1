<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 - 도크 입문 관제 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Navigation Bar -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-red-600 rounded-xl flex items-center justify-center font-black text-white italic tracking-tighter shadow-lg shadow-red-600/30">
          SHC
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight leading-tight">신흥정밀 입문 관제 시스템</h1>
          <p class="text-[11px] text-slate-400">Dock Arrival Control Dashboard</p>
        </div>
      </div>

      <div id="userInfoArea" class="hidden flex items-center gap-3">
        <span class="text-xs text-slate-300 font-medium bg-slate-700/50 px-3 py-1.5 rounded-lg border border-slate-600/50">관제 담당자</span>
        <button onclick="handleLogout()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold px-3 py-1.5 rounded-lg transition">
          로그아웃
        </button>
      </div>
    </div>
  </header>

  <!-- Passcode Login Section -->
  <section id="loginSection" class="max-w-md mx-auto mt-20 p-6 bg-slate-800 rounded-3xl border border-slate-700 shadow-2xl">
    <div class="text-center mb-6">
      <h2 class="text-xl font-bold text-white">담당자 인증</h2>
      <p class="text-xs text-slate-400 mt-1">관제 시스템 접근을 위해 관리자 비밀번호를 입력해 주세요.</p>
    </div>
    <form onsubmit="handlePasscodeLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">비밀번호</label>
        <input type="password" id="adminPassword" required placeholder="비밀번호 입력" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs font-semibold text-white focus:outline-none focus:border-red-500">
      </div>
      <button type="submit" class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-red-600/30">
        로그인
      </button>
    </form>
  </section>

  <!-- Dashboard Section -->
  <main id="dashboardSection" class="hidden max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <!-- Stat Summary Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/60">
        <div class="text-xs font-semibold text-slate-400">금일 총 입문</div>
        <div id="statTotal" class="text-2xl font-extrabold text-white mt-1">0 <span class="text-xs font-normal text-slate-400">건</span></div>
      </div>
      <div class="bg-slate-800/60 p-4 rounded-2xl border border-amber-500/30 bg-amber-500/5">
        <div class="text-xs font-semibold text-amber-400">구역 내 대기 중</div>
        <div id="statWaiting" class="text-2xl font-extrabold text-amber-400 mt-1">0 <span class="text-xs font-normal text-amber-400/60">건</span></div>
      </div>
      <div class="bg-slate-800/60 p-4 rounded-2xl border border-emerald-500/30 bg-emerald-500/5">
        <div class="text-xs font-semibold text-emerald-400">출차 완료</div>
        <div id="statCompleted" class="text-2xl font-extrabold text-emerald-400 mt-1">0 <span class="text-xs font-normal text-emerald-400/60">건</span></div>
      </div>
      <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/60">
        <div class="text-xs font-semibold text-slate-400">취소 건수</div>
        <div id="statCanceled" class="text-2xl font-extrabold text-slate-400 mt-1">0 <span class="text-xs font-normal text-slate-400">건</span></div>
      </div>
    </div>

    <!-- Controls & Table Area -->
    <div class="bg-slate-800/80 rounded-2xl border border-slate-700/60 overflow-hidden shadow-xl">
      <div class="p-4 border-b border-slate-700/60 flex flex-wrap gap-3 items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-list-check text-red-500"></i> 입문 차량 실시간 목록
        </h3>
        <button onclick="fetchLogs()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right"></i> 새로고침
        </button>
      </div>

      <!-- Table Area -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-900/60 text-slate-400 font-semibold border-b border-slate-700/60">
            <tr>
              <th class="p-3.5">접수 시간</th>
              <th class="p-3.5">차량 번호</th>
              <th class="p-3.5">운전자</th>
              <th class="p-3.5">연락처</th>
              <th class="p-3.5">상태</th>
              <th class="p-3.5 text-right">상태 변경 관리</th>
            </tr>
          </thead>
          <tbody id="logsTableBody" class="divide-y divide-slate-700/40">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://hlhjmnsgqhysvilltfpf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 관리자 비밀번호 (기본: 1234)
    const ADMIN_PASSWORD = "1234";

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // 자동 세션 확인
    window.addEventListener('DOMContentLoaded', () => {
      const isAuth = localStorage.getItem('shc_admin_auth');
      if (isAuth === 'true') {
        showDashboard();
      }
    });

    // 로그인 처리
    function handlePasscodeLogin(e) {
      e.preventDefault();
      const inputPw = document.getElementById('adminPassword').value.trim();

      if (inputPw === ADMIN_PASSWORD) {
        localStorage.setItem('shc_admin_auth', 'true');
        showDashboard();
      } else {
        alert('비밀번호가 올바르지 않습니다.');
        document.getElementById('adminPassword').value = '';
      }
    }

    function handleLogout() {
      localStorage.removeItem('shc_admin_auth');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('userInfoArea').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('adminPassword').value = '';
    }

    function showDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('userInfoArea').classList.remove('hidden');

      fetchLogs();
      setInterval(fetchLogs, 15000);
    }

    async function fetchLogs() {
      const { data, error } = await supabase
        .from('entry_logs')
        .select('*')
        .order('id', { ascending: false })
        .limit(100);

      if (error) {
        console.error('Data fetch error:', error.message);
        return;
      }

      updateStats(data || []);
      renderTable(data || []);
    }

    function updateStats(logs) {
      const total = logs.length;
      const waiting = logs.filter(l => (l.status || '').includes('대기')).length;
      const completed = logs.filter(l => (l.status || '').includes('출차')).length;
      const canceled = logs.filter(l => (l.status || '').includes('취소')).length;

      document.getElementById('statTotal').innerText = total;
      document.getElementById('statWaiting').innerText = waiting;
      document.getElementById('statCompleted').innerText = completed;
      document.getElementById('statCanceled').innerText = canceled;
    }

    function renderTable(logs) {
      const tbody = document.getElementById('logsTableBody');
      if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">입문 내역이 존재하지 않습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = logs.map(item => {
        const isWaiting = (item.status || '').includes('대기');
        let badgeStyle = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        if (item.status.includes('출차')) badgeStyle = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        if (item.status.includes('취소')) badgeStyle = 'bg-rose-500/10 text-rose-400 border-rose-500/20';

        const actionBtn = isWaiting ? `
          <button onclick="updateStatus(${item.id}, '출차 완료')" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition shadow-md">
            출차 완료 처리
          </button>
        ` : `<span class="text-slate-500 text-[11px]">완료됨</span>`;

        // entry_time 또는 created_at 모두 호환되도록 처리
        const rawTime = item.entry_time || item.created_at;
        const formattedTime = rawTime ? new Date(rawTime).toLocaleString('ko-KR', {
          month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        }) : '-';

        return `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="p-3.5 text-slate-400">${formattedTime}</td>
            <td class="p-3.5 font-bold text-white">${escapeHtml(item.car_num)}</td>
            <td class="p-3.5 font-semibold text-slate-200">${escapeHtml(item.driver_name)}</td>
            <td class="p-3.5 text-slate-300 font-mono">${escapeHtml(item.driver_phone)}</td>
            <td class="p-3.5">
              <span class="px-2.5 py-1 rounded-full text-[11px] font-bold border ${badgeStyle}">
                ${escapeHtml(item.status)}
              </span>
            </td>
            <td class="p-3.5 text-right">${actionBtn}</td>
          </tr>
        `;
      }).join('');
    }

    async function updateStatus(id, newStatus) {
      if (!confirm(`해당 차량을 '${newStatus}' 상태로 변경하시겠습니까?`)) return;

      const { error } = await supabase
        .from('entry_logs')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) {
        alert('상태 변경 실패: ' + error.message);
      } else {
        fetchLogs();
      }
    }
  </script>
</body>
</html>
