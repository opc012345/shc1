<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량입문 관제 시스템 - 신흥정밀</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800" onclick="stopTitleFlash()">

  <!-- 상단 네비게이션 바 -->
  <nav class="bg-slate-900 text-white px-6 py-4 flex flex-wrap justify-between items-center shadow-lg gap-4">
    <div class="flex items-center gap-3">
      <span class="bg-red-600 text-white font-black text-xs px-2 py-1 rounded">SHC</span>
      <h1 class="text-xl font-bold tracking-tight">차량입문 관제 시스템</h1>
      <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded-full border border-emerald-500/30 font-medium">실시간</span>
    </div>
    <div class="flex items-center gap-3 sm:gap-4 text-sm">
      <div id="current-time" class="text-slate-400 font-mono hidden sm:block"></div>
      <button id="sound-toggle-btn" onclick="toggleSound()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-2">
        <i class="fa-solid fa-bell"></i> <span id="sound-status-text">알림 켜짐 (On)</span>
      </button>
      <button onclick="fetchData()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg transition" title="새로고침">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <!-- 로그아웃 버튼 추가 -->
      <button onclick="handleLogout()" class="bg-rose-600/80 hover:bg-rose-600 text-white px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1.5 text-xs sm:text-sm">
        <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
      </button>
    </div>
  </nav>

  <!-- 메인 컨텐츠 영역 -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">

    <!-- 현황 요약 카드 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-slate-400 uppercase">금일 총 입문</p>
          <p id="stat-total" class="text-2xl font-black text-slate-800 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg"><i class="fa-solid fa-truck"></i></div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-slate-400 uppercase">구역 내 대기중</p>
          <p id="stat-waiting" class="text-2xl font-black text-amber-600 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg"><i class="fa-solid fa-clock"></i></div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-slate-400 uppercase">출차 완료</p>
          <p id="stat-completed" class="text-2xl font-black text-emerald-600 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-check"></i></div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-slate-400 uppercase">입문 취소</p>
          <p id="stat-cancelled" class="text-2xl font-black text-rose-600 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg"><i class="fa-solid fa-ban"></i></div>
      </div>
    </div>

    <!-- 검색, 필터 및 엑셀 다운로드 -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col sm:flex-row gap-4 justify-between items-center">
      <div class="relative w-full sm:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="search-input" onkeyup="filterData()" placeholder="차량번호 / 기사명 / 연락처 검색" class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
      </div>
      <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto justify-end">
        <div class="inline-flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
          <button onclick="setStatusFilter('ALL')" id="filter-all" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white transition">전체</button>
          <button onclick="setStatusFilter('대기중')" id="filter-waiting" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">대기중</button>
          <button onclick="setStatusFilter('출차완료')" id="filter-completed" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">출차완료</button>
        </div>
        <input type="date" id="date-filter" onchange="fetchData()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold focus:outline-none">
        <button onclick="downloadExcel()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-file-excel"></i> 엑셀 다운로드
        </button>
      </div>
    </div>

    <!-- 입문 데이터 테이블 -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-400 font-semibold text-xs border-b border-slate-100 uppercase">
            <tr>
              <th class="p-4">입문일시</th>
              <th class="p-4">차량번호</th>
              <th class="p-4">운전자 성함</th>
              <th class="p-4">연락처</th>
              <th class="p-4">상태</th>
              <th class="p-4 text-center">관리</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-400 font-medium">데이터를 불러오는 중입니다...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- 자바스크립트 스크립트 -->
  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i'; 
    
    // Supabase 클라이언트 초기화
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allRecords = [];
    let currentStatusFilter = 'ALL';
    let isSoundOn = true;
    let originalTitle = "차량입문 관제 시스템 - 신흥정밀";
    let titleInterval = null;

    window.onload = () => {
      document.getElementById('date-filter').valueAsDate = new Date();
      updateClock();
      setInterval(updateClock, 1000);
      requestNotificationPermission();
      fetchData();
      subscribeRealtime();
    };

    // 로그아웃 처리 함수
    async function handleLogout() {
      if (confirm('로그아웃 하시겠습니까?')) {
        try {
          await _supabase.auth.signOut();
        } catch (e) {
          console.error("Auth signOut Error:", e);
        }
        // 세션/로컬스토리지 정리 후 로그인 페이지로 이동 (필요 시 경로 변경)
        sessionStorage.clear();
        localStorage.clear();
        window.location.href = 'index.html'; // 또는 로그인 페이지 경로
      }
    }

    // 데스크톱 알림 권한 요청
    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('current-time').innerText = now.toLocaleString('ko-KR');
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      const btnText = document.getElementById('sound-status-text');
      const btn = document.getElementById('sound-toggle-btn');
      if(isSoundOn) {
        btnText.innerText = "알림 켜짐 (On)";
        btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-2";
      } else {
        btnText.innerText = "알림 끄기 (Off)";
        btn.className = "bg-slate-600 hover:bg-slate-500 text-white px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-2";
      }
    }

    async function fetchData() {
      const selectedDate = document.getElementById('date-filter').value;
      const start = `${selectedDate}T00:00:00`;
      const end = `${selectedDate}T23:59:59`;

      const { data, error } = await _supabase
        .from('dock_control')
        .select('*')
        .gte('created_at', start)
        .lte('created_at', end)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Fetch error:', error);
        document.getElementById('table-body').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-500 font-medium">데이터 불러오기 실패: ${error.message}</td></tr>`;
        return;
      }

      allRecords = data || [];
      renderData();
    }

    function subscribeRealtime() {
      _supabase
        .channel('public:dock_control')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dock_control' }, payload => {
          const newCar = payload.new;
          
          // 1. 소리 알림
          if(isSoundOn) {
            try {
              const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
              audio.play();
            } catch(e){}
          }

          // 2. 윈도우 우측 데스크톱 알림 (닫기 전까지 유지)
          showDesktopNotification(newCar);

          // 3. 작업표시줄 반짝임 (웹페이지 타이틀 깜빡임)
          startTitleFlash();

          fetchData();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'dock_control' }, payload => {
          fetchData();
        })
        .subscribe();
    }

    // 데스크톱 알림 발송 (requireInteraction: true 로 유지)
    function showDesktopNotification(carData) {
      if ("Notification" in window && Notification.permission === "granted") {
        const title = `🚨 [신규 입문 등록] ${carData.car_number || '차량'}`;
        const options = {
          body: `운전자: ${carData.driver_name || '미기재'} | 연락처: ${carData.phone_number || '미기재'}`,
          icon: 'https://cdn-icons-png.flaticon.com/512/2555/2555013.png',
          requireInteraction: true
        };
        new Notification(title, options);
      }
    }

    // 작업표시줄 반짝임 효과 (타이틀 토글)
    function startTitleFlash() {
      if (titleInterval) clearInterval(titleInterval);
      let isAlt = false;
      titleInterval = setInterval(() => {
        document.title = isAlt ? originalTitle : "🚨 [신규 입문 등록!] 확인해 주세요";
        isAlt = !isAlt;
      }, 1000);
    }

    // 반짝임 중지 (화면 클릭 시)
    function stopTitleFlash() {
      if (titleInterval) {
        clearInterval(titleInterval);
        titleInterval = null;
        document.title = originalTitle;
      }
    }

    function renderData() {
      const tbody = document.getElementById('table-body');
      const query = document.getElementById('search-input').value.toLowerCase();

      let filtered = allRecords.filter(item => {
        const matchesStatus = currentStatusFilter === 'ALL' || item.status === currentStatusFilter;
        const matchesSearch = (item.car_number && item.car_number.toLowerCase().includes(query)) ||
                              (item.driver_name && item.driver_name.toLowerCase().includes(query)) ||
                              (item.phone_number && item.phone_number.toLowerCase().includes(query));
        return matchesStatus && matchesSearch;
      });

      document.getElementById('stat-total').innerText = allRecords.length;
      document.getElementById('stat-waiting').innerText = allRecords.filter(i => i.status === '대기중' || !i.status).length;
      document.getElementById('stat-completed').innerText = allRecords.filter(i => i.status === '출차완료').length;
      document.getElementById('stat-cancelled').innerText = allRecords.filter(i => i.status === '입문취소').length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-medium">조회된 데이터가 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const timeStr = new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        const status = item.status || '대기중';
        
        let statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700">대기중</span>';
        if(status === '출차완료') statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700">출차완료</span>';
        if(status === '입문취소') statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-700">입문취소</span>';

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-4 font-mono text-slate-500">${timeStr}</td>
            <td class="p-4 font-bold text-slate-900">${item.car_number || '-'}</td>
            <td class="p-4 font-medium text-slate-700">${item.driver_name || '-'}</td>
            <td class="p-4 text-slate-500 font-mono">${item.phone_number || '-'}</td>
            <td class="p-4">${statusBadge}</td>
            <td class="p-4 text-center">
              ${status === '대기중' ? `
                <button onclick="updateStatus('${item.id}', '출차완료')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-lg text-xs font-bold transition">출차</button>
                <button onclick="updateStatus('${item.id}', '입문취소')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded-lg text-xs font-bold transition ml-1">취소</button>
              ` : `<span class="text-xs text-slate-400 font-medium">처리완료</span>`}
            </td>
          </tr>
        `;
      }).join('');
    }

    async function updateStatus(id, newStatus) {
      const { error } = await _supabase
        .from('dock_control')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) alert('상태 변경 실패: ' + error.message);
      else fetchData();
    }

    function setStatusFilter(status) {
      currentStatusFilter = status;
      ['all', 'waiting', 'completed'].forEach(s => {
        const btn = document.getElementById(`filter-${s}`);
        if ((s === 'all' && status === 'ALL') || (s === 'waiting' && status === '대기중') || (s === 'completed' && status === '출차완료')) {
          btn.className = "px-3 py-1.5 rounded-lg bg-slate-900 text-white transition";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
        }
      });
      renderData();
    }

    function filterData() { renderData(); }

    // 엑셀 다운로드 기능
    function downloadExcel() {
      if(allRecords.length === 0) {
        alert('다운로드할 데이터가 없습니다.');
        return;
      }
      
      const excelData = allRecords.map(item => ({
        '입문일시': new Date(item.created_at).toLocaleString('ko-KR'),
        '차량번호': item.car_number || '-',
        '운전자 성함': item.driver_name || '-',
        '연락처': item.phone_number || '-',
        '상태': item.status || '대기중'
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "입문현황");

      const selectedDate = document.getElementById('date-filter').value;
      XLSX.writeFile(workbook, `차량입문현황_${selectedDate}.xlsx`);
    }
  </script>
</body>
</html>
