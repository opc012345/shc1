<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신흥정밀 - 입출문 관리자 시스템</title>

  <!-- PWA 모바일 앱 설치 지원 메타태그 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHC 관리자">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2555/2555013.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans select-none">

  <!-- 헤더 -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <span class="bg-red-600 text-white font-black text-lg px-2.5 py-1 rounded-md tracking-wider">SHC</span>
      <h1 class="text-xl font-bold">차량 입출문 관리자 시스템</h1>
      <span id="realtime-status" class="bg-emerald-500/20 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/30 font-bold ml-2">실시간 연결됨</span>
    </div>

    <div class="flex items-center gap-4">
      <button onclick="openRegisterModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold px-4 py-2 rounded-xl flex items-center gap-2 transition">
        <i class="fa-solid fa-plus"></i> 수동 차량 등록
      </button>
    </div>
  </header>

  <!-- 메인 영역 -->
  <main class="flex-1 p-6 space-y-6 max-w-7xl w-full mx-auto">
    
    <!-- 요약 통계 카운터 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex justify-between items-center">
        <div>
          <p class="text-xs text-slate-400 font-bold mb-1">금일 총 등록</p>
          <p id="stat-total" class="text-2xl font-black text-white font-mono">0</p>
        </div>
        <div class="bg-slate-700/50 text-slate-300 p-3 rounded-xl"><i class="fa-solid fa-list text-xl"></i></div>
      </div>

      <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex justify-between items-center">
        <div>
          <p class="text-xs text-amber-400 font-bold mb-1">대기 중</p>
          <p id="stat-waiting" class="text-2xl font-black text-amber-400 font-mono">0</p>
        </div>
        <div class="bg-amber-500/20 text-amber-400 p-3 rounded-xl"><i class="fa-solid fa-clock text-xl"></i></div>
      </div>

      <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex justify-between items-center">
        <div>
          <p class="text-xs text-blue-400 font-bold mb-1">하역 중 (입문)</p>
          <p id="stat-working" class="text-2xl font-black text-blue-400 font-mono">0</p>
        </div>
        <div class="bg-blue-500/20 text-blue-400 p-3 rounded-xl"><i class="fa-solid fa-truck-ramp-box text-xl"></i></div>
      </div>

      <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex justify-between items-center">
        <div>
          <p class="text-xs text-emerald-400 font-bold mb-1">출문 완료</p>
          <p id="stat-completed" class="text-2xl font-black text-emerald-400 font-mono">0</p>
        </div>
        <div class="bg-emerald-500/20 text-emerald-400 p-3 rounded-xl"><i class="fa-solid fa-circle-check text-xl"></i></div>
      </div>
    </div>

    <!-- 차량 현황 목록 테이블 -->
    <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-truck-moving text-amber-400"></i> 당일 차량 관리 목록
        </h2>
        <input type="text" id="search-input" onkeyup="filterTable()" placeholder="차량번호 또는 운전자 검색..." class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500 w-64">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/80 text-slate-400 uppercase text-xs font-semibold">
            <tr>
              <th class="px-4 py-3">접수 시간</th>
              <th class="px-4 py-3">차량 번호</th>
              <th class="px-4 py-3">운전자 성함</th>
              <th class="px-4 py-3">연락처</th>
              <th class="px-4 py-3">현재 상태</th>
              <th class="px-4 py-3 text-right">상태 변경 관리</th>
            </tr>
          </thead>
          <tbody id="manager-table-body" class="divide-y divide-slate-700/50">
            <!-- 차량 목록 데이터 로드 -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- 수동 차량 등록 모달 -->
  <div id="register-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold">수동 차량 등록</h3>
        <button onclick="closeRegisterModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">차량 번호</label>
          <input type="text" id="reg-car-number" placeholder="예: 80사9394" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">운전자 성함</label>
          <input type="text" id="reg-driver-name" placeholder="예: 홍길동" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">연락처</label>
          <input type="text" id="reg-phone-number" placeholder="예: 010-1234-5678" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeRegisterModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-sm transition">취소</button>
        <button onclick="submitManualRegister()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-sm transition">등록 완료</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i';

    let _supabase = null;
    let rawDataList = [];

    window.onload = () => {
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      loadManagerData();
      subscribeRealtime();
    };

    async function loadManagerData() {
      if (!_supabase) return;

      const today = new Date().toISOString().split('T')[0];
      const start = `${today}T00:00:00`;
      const end = `${today}T23:59:59`;

      const { data, error } = await _supabase
        .from('dock_control')
        .select('*')
        .gte('created_at', start)
        .lte('created_at', end)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Fetch error:', error);
        return;
      }

      rawDataList = data || [];
      updateStats();
      renderTable(rawDataList);
    }

    function subscribeRealtime() {
      if (!_supabase) return;
      const statusBadge = document.getElementById('realtime-status');

      _supabase
        .channel('public:dock_control')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'dock_control' }, () => {
          loadManagerData();
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            statusBadge.innerText = '실시간 연결됨';
            statusBadge.className = 'bg-emerald-500/20 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/30 font-bold ml-2';
          } else {
            statusBadge.innerText = '연결 끊김';
            statusBadge.className = 'bg-rose-500/20 text-rose-400 text-xs px-2.5 py-1 rounded-full border border-rose-500/30 font-bold ml-2';
          }
        });
    }

    function updateStats() {
      const total = rawDataList.length;
      const waiting = rawDataList.filter(i => i.status === '대기중' || i.status === '대기').length;
      const working = rawDataList.filter(i => i.status === '입문' || i.status === '하역중').length;
      const completed = rawDataList.filter(i => i.status === '출문완료' || i.status === '출문').length;

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-waiting').innerText = waiting;
      document.getElementById('stat-working').innerText = working;
      document.getElementById('stat-completed').innerText = completed;
    }

    function renderTable(list) {
      const tbody = document.getElementById('manager-table-body');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500 font-semibold">오늘 등록된 차량 내역이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(item => {
        const timeStr = new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        
        let statusTag = '';
        if (item.status === '대기중' || item.status === '대기') {
          statusTag = `<span class="bg-amber-500/20 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-full border border-amber-500/30">대기중</span>`;
        } else if (item.status === '입문' || item.status === '하역중') {
          statusTag = `<span class="bg-blue-500/20 text-blue-400 text-xs font-bold px-2.5 py-1 rounded-full border border-blue-500/30">하역중 (입문)</span>`;
        } else {
          statusTag = `<span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-full border border-emerald-500/30">출문 완료</span>`;
        }

        return `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="px-4 py-3.5 font-mono text-xs text-slate-400">${timeStr}</td>
            <td class="px-4 py-3.5 font-bold text-white">${item.car_number || '-'}</td>
            <td class="px-4 py-3.5">${item.driver_name || '-'}</td>
            <td class="px-4 py-3.5 font-mono text-xs text-slate-400">${item.phone_number || '-'}</td>
            <td class="px-4 py-3.5">${statusTag}</td>
            <td class="px-4 py-3.5 text-right space-x-1">
              <button onclick="updateStatus('${item.id}', '대기중')" class="px-2.5 py-1 text-xs bg-slate-700 hover:bg-amber-600 rounded-lg text-slate-200 font-semibold transition">대기</button>
              <button onclick="updateStatus('${item.id}', '입문')" class="px-2.5 py-1 text-xs bg-slate-700 hover:bg-blue-600 rounded-lg text-slate-200 font-semibold transition">입문</button>
              <button onclick="updateStatus('${item.id}', '출문완료')" class="px-2.5 py-1 text-xs bg-slate-700 hover:bg-emerald-600 rounded-lg text-slate-200 font-semibold transition">출문</button>
            </td>
          </tr>`;
      }).join('');
    }

    async function updateStatus(id, newStatus) {
      if (!_supabase) return;
      const { error } = await _supabase
        .from('dock_control')
        .update({ status: newStatus, updated_at: new Date().toISOString() })
        .eq('id', id);

      if (error) {
        alert('상태 변경 실패: ' + error.message);
      } else {
        loadManagerData();
      }
    }

    function filterTable() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = rawDataList.filter(i => 
        (i.car_number && i.car_number.toLowerCase().includes(q)) ||
        (i.driver_name && i.driver_name.toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    function openRegisterModal() {
      document.getElementById('register-modal').classList.remove('hidden');
    }

    function closeRegisterModal() {
      document.getElementById('register-modal').classList.add('hidden');
      document.getElementById('reg-car-number').value = '';
      document.getElementById('reg-driver-name').value = '';
      document.getElementById('reg-phone-number').value = '';
    }

    async function submitManualRegister() {
      const carNumber = document.getElementById('reg-car-number').value.trim();
      const driverName = document.getElementById('reg-driver-name').value.trim();
      const phoneNumber = document.getElementById('reg-phone-number').value.trim();

      if (!carNumber) {
        alert('차량 번호를 입력해 주세요.');
        return;
      }

      const { error } = await _supabase
        .from('dock_control')
        .insert([{ car_number: carNumber, driver_name: driverName, phone_number: phoneNumber, status: '대기중' }]);

      if (error) {
        alert('등록 실패: ' + error.message);
      } else {
        closeRegisterModal();
        loadManagerData();
      }
    }
  </script>
</body>
</html>
