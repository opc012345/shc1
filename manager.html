<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량입문 관제 시스템 - 신흥정밀</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(225, 29, 72, 1); box-shadow: 0 0 20px rgba(225, 29, 72, 0.5); }
      50% { border-color: rgba(225, 29, 72, 0.3); box-shadow: 0 0 0px rgba(225, 29, 72, 0); }
    }
    .flash-alert {
      animation: pulse-border 1.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800" onclick="stopTitleFlash()">

  <!-- 담당자 비밀번호 로그인 모달 -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-block bg-red-600 text-white font-black text-xs px-2.5 py-1 rounded mb-1">SHC</div>
        <h2 class="text-xl font-bold text-slate-900">담당자 관제 시스템 접속</h2>
        <p class="text-xs text-slate-500">접속 비밀번호를 입력해 주세요.</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">비밀번호</label>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-slate-300 text-slate-900 focus:ring-slate-900">
            <span class="text-xs font-bold text-slate-600">로그인 상태 유지</span>
          </label>
        </div>

        <button type="submit" id="login-submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition text-sm shadow-md mt-2">
          로그인
        </button>
      </form>

      <div id="login-error-msg" class="hidden text-xs text-rose-500 font-bold text-center bg-rose-50 p-3 rounded-xl border border-rose-100"></div>
    </div>
  </div>

  <!-- 상단 네비게이션 바 -->
  <nav class="bg-slate-900 text-white px-6 py-4 flex flex-wrap justify-between items-center shadow-lg gap-4">
    <div class="flex items-center gap-3">
      <span class="bg-red-600 text-white font-black text-sm px-3 py-1 rounded">SHC</span>
      <h1 class="text-2xl font-black tracking-tight">차량입문 관제 시스템</h1>
      <span id="realtime-status" class="bg-amber-500/20 text-amber-400 text-xs px-3 py-1 rounded-full border border-amber-500/30 font-medium">연결 중...</span>
    </div>
    <div class="flex items-center gap-4 text-sm font-semibold">
      <div id="current-time" class="text-slate-300 font-mono text-base hidden md:block"></div>
      
      <button id="noti-permission-btn" onclick="enableNotificationsAndSound()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded-xl transition flex items-center gap-2">
        <i class="fa-solid fa-bell-slash"></i> <span>알림 권한 요청</span>
      </button>

      <button id="sound-toggle-btn" onclick="toggleSound()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl transition flex items-center gap-2">
        <i class="fa-solid fa-volume-high"></i> <span id="sound-status-text">소리 On</span>
      </button>

      <button onclick="fetchData()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl transition" title="새로고침">
        <i class="fa-solid fa-rotate-right"></i>
      </button>

      <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-2 rounded-xl transition flex items-center gap-2">
        <i class="fa-solid fa-right-from-bracket"></i> <span>로그아웃</span>
      </button>
    </div>
  </nav>

  <!-- 메인 컨텐츠 영역 (화면 넓게 expansion) -->
  <main class="w-full px-6 py-6 space-y-6">

    <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">

      <!-- 좌측 대형 실시간 입문 알림 카드 -->
      <div class="xl:col-span-1 space-y-4">
        <div id="latest-car-card" class="bg-slate-900 text-white p-6 rounded-2xl border-2 border-slate-700 shadow-xl transition-all duration-300 relative overflow-hidden">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
            <span class="text-xs font-bold text-rose-400 uppercase tracking-wider flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span> 최근 입문 차량
            </span>
            <span id="latest-car-time" class="text-xs font-mono text-slate-400">-</span>
          </div>

          <div class="space-y-4">
            <div>
              <p class="text-xs text-slate-400 font-medium">차량 번호</p>
              <p id="latest-car-number" class="text-3xl xl:text-4xl font-black text-amber-400 tracking-tight mt-1">입문 대기중</p>
            </div>
            
            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-800">
              <div>
                <p class="text-xs text-slate-400 font-medium">운전자 성함</p>
                <p id="latest-driver-name" class="text-lg font-bold text-slate-100 mt-0.5">-</p>
              </div>
              <div>
                <p class="text-xs text-slate-400 font-medium">연락처</p>
                <p id="latest-phone-number" class="text-sm font-mono text-slate-300 mt-1">-</p>
              </div>
            </div>

            <!-- 대기 상태 전용 태그 -->
            <div id="latest-status-badge" class="pt-2 hidden">
              <span class="inline-block w-full text-center py-2 bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded-xl font-bold text-sm">
                현재 대기중
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- 우측 관제 본문 (넓게 4칸 차지) -->
      <div class="xl:col-span-4 space-y-6">

        <!-- 현황 요약 카드 (큼직하게 확대) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex justify-between items-center">
            <div>
              <p class="text-xs font-bold text-slate-400 uppercase">금일 총 입문</p>
              <p id="stat-total" class="text-3xl font-black text-slate-900 mt-1">0</p>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl"><i class="fa-solid fa-truck"></i></div>
          </div>
          <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex justify-between items-center">
            <div>
              <p class="text-xs font-bold text-slate-400 uppercase">구역 내 대기중</p>
              <p id="stat-waiting" class="text-3xl font-black text-amber-600 mt-1">0</p>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl"><i class="fa-solid fa-clock"></i></div>
          </div>
          <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex justify-between items-center">
            <div>
              <p class="text-xs font-bold text-slate-400 uppercase">출차 완료</p>
              <p id="stat-completed" class="text-3xl font-black text-emerald-600 mt-1">0</p>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl"><i class="fa-solid fa-check"></i></div>
          </div>
          <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex justify-between items-center">
            <div>
              <p class="text-xs font-bold text-slate-400 uppercase">입문 취소</p>
              <p id="stat-cancelled" class="text-3xl font-black text-rose-600 mt-1">0</p>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl"><i class="fa-solid fa-ban"></i></div>
          </div>
        </div>

        <!-- 검색 및 컨트롤 영역 -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row gap-4 justify-between items-center">
          <div class="relative w-full md:w-96">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-base"></i>
            <input type="text" id="search-input" onkeyup="filterData()" placeholder="차량번호 / 기사명 / 연락처 검색" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
          </div>
          
          <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-between md:justify-end">
            <div class="inline-flex bg-slate-100 p-1.5 rounded-xl text-xs font-bold">
              <button onclick="setStatusFilter('ALL')" id="filter-all" class="px-4 py-2 rounded-lg bg-slate-900 text-white transition">전체</button>
              <button onclick="setStatusFilter('대기중')" id="filter-waiting" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">대기중</button>
              <button onclick="setStatusFilter('출차완료')" id="filter-completed" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">출차완료</button>
            </div>
            
            <input type="date" id="date-filter" onchange="fetchData()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold focus:outline-none">
            
            <div class="flex items-center gap-2">
              <button onclick="deleteSelectedRecords()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-trash-can"></i> 선택 삭제
              </button>

              <button onclick="downloadExcel()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-excel"></i> 엑셀 다운로드
              </button>
            </div>
          </div>
        </div>

        <!-- 데이터 목록 (표 사이즈 확대) -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-base">
              <thead class="bg-slate-50 text-slate-500 font-bold text-xs uppercase border-b border-slate-200">
                <tr>
                  <th class="p-4 w-14 text-center">
                    <input type="checkbox" id="select-all-checkbox" onclick="toggleSelectAll(this)" class="w-4 h-4 rounded border-slate-300 text-slate-900 focus:ring-slate-900 cursor-pointer">
                  </th>
                  <th class="p-4">입문일시</th>
                  <th class="p-4">차량번호</th>
                  <th class="p-4">운전자 성함</th>
                  <th class="p-4">연락처</th>
                  <th class="p-4">상태</th>
                  <th class="p-4 text-center">관리</th>
                </tr>
              </thead>
              <tbody id="table-body" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="7" class="p-10 text-center text-slate-400 font-medium">데이터를 불러오는 중입니다...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i'; 
    
    const MANAGER_PASSWORD = 'manager1234';

    let _supabase = null;
    let allRecords = [];
    let currentStatusFilter = 'ALL';
    let isSoundOn = true;
    let originalTitle = "차량입문 관제 시스템 - 신흥정밀";
    let titleInterval = null;
    let notificationQueue = [];

    window.onload = async () => {
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      document.getElementById('date-filter').valueAsDate = new Date();
      updateClock();
      setInterval(updateClock, 1000);

      const isAuthLocal = localStorage.getItem('shc_manager_auth') === 'true';
      const isAuthSession = sessionStorage.getItem('shc_manager_auth') === 'true';

      if (isAuthLocal || isAuthSession) {
        hideLoginModal();
        initSystem();
      } else {
        showLoginModal();
      }
    };

    function showLoginModal() {
      document.getElementById('login-modal').classList.remove('hidden');
    }

    function hideLoginModal() {
      document.getElementById('login-modal').classList.add('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const passwordInput = document.getElementById('login-password').value;
      const rememberMe = document.getElementById('remember-me').checked;
      const errorMsg = document.getElementById('login-error-msg');

      if (passwordInput === MANAGER_PASSWORD) {
        if (rememberMe) {
          localStorage.setItem('shc_manager_auth', 'true');
        } else {
          sessionStorage.setItem('shc_manager_auth', 'true');
        }
        errorMsg.classList.add('hidden');
        hideLoginModal();
        initSystem();
      } else {
        errorMsg.innerText = '비밀번호가 올바르지 않습니다.';
        errorMsg.classList.remove('hidden');
      }
    }

    function handleLogout() {
      if (confirm('로그아웃 하시겠습니까?')) {
        localStorage.removeItem('shc_manager_auth');
        sessionStorage.removeItem('shc_manager_auth');
        document.getElementById('login-password').value = '';
        showLoginModal();
      }
    }

    function initSystem() {
      checkNotificationStatus();
      fetchData();
      subscribeRealtime();
    }

    function enableNotificationsAndSound() {
      if ('speechSynthesis' in window) {
        const testUtterance = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(testUtterance);
      }

      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          checkNotificationStatus();
          if (permission === "granted") {
            const testNoti = new Notification("알림이 활성화되었습니다", { 
              body: "신규 차량 입문 시 백그라운드에서도 알림을 발송합니다.",
              icon: 'https://cdn-icons-png.flaticon.com/512/2555/2555013.png'
            });
            testNoti.onclick = (e) => { e.preventDefault(); window.focus(); };
          } else {
            alert("알림 권한이 거부되었습니다.");
          }
        });
      }
    }

    function checkNotificationStatus() {
      const btn = document.getElementById('noti-permission-btn');
      if ("Notification" in window && Notification.permission === "granted") {
        btn.className = "bg-slate-800 text-slate-300 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 cursor-default";
        btn.innerHTML = `<i class="fa-solid fa-bell text-emerald-400"></i> <span>알림 권한 완료</span>`;
      } else {
        btn.className = "bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 animate-pulse";
        btn.innerHTML = `<i class="fa-solid fa-bell-slash"></i> <span>알림 권한 필요</span>`;
      }
    }

    function updateClock() {
      document.getElementById('current-time').innerText = new Date().toLocaleString('ko-KR');
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      const btnText = document.getElementById('sound-status-text');
      const btn = document.getElementById('sound-toggle-btn');
      if(isSoundOn) {
        btnText.innerText = "소리 On";
        btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl transition flex items-center gap-2";
      } else {
        btnText.innerText = "소리 Off";
        btn.className = "bg-slate-600 hover:bg-slate-500 text-white px-3 py-2 rounded-xl transition flex items-center gap-2";
      }
    }

    async function fetchData() {
      if (!_supabase) return;
      const selectedDate = document.getElementById('date-filter').value;
      const start = `${selectedDate}T00:00:00`;
      const end = `${selectedDate}T23:59:59`;

      const { data, error } = await _supabase
        .from('dock_control')
        .select('*')
        .gte('created_at', start)
        .lte('created_at', end)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Fetch error:', error);
        return;
      }

      allRecords = data || [];
      renderData();
    }

    function subscribeRealtime() {
      if (!_supabase) return;
      const statusBadge = document.getElementById('realtime-status');

      _supabase
        .channel('public:dock_control')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'dock_control' },
          (payload) => {
            if (payload.eventType === 'INSERT') {
              const newCar = payload.new;
              playNotificationSound();
              showDesktopNotification(newCar);
              startTitleFlash();
              updateLatestCarCard(newCar);
            }
            fetchData();
          }
        )
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            statusBadge.innerText = '실시간 연결됨';
            statusBadge.className = 'bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/30 font-medium';
          } else {
            statusBadge.innerText = '실시간 재연결 중';
            statusBadge.className = 'bg-rose-500/20 text-rose-400 text-xs px-3 py-1 rounded-full border border-rose-500/30 font-medium';
          }
        });
    }

    function updateLatestCarCard(carData) {
      const card = document.getElementById('latest-car-card');
      const timeStr = new Date(carData.created_at || Date.now()).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      
      document.getElementById('latest-car-time').innerText = timeStr;
      document.getElementById('latest-car-number').innerText = carData.car_number || '-';
      document.getElementById('latest-driver-name').innerText = carData.driver_name || '-';
      document.getElementById('latest-phone-number').innerText = carData.phone_number || '-';

      const statusBadge = document.getElementById('latest-status-badge');
      const currentStatus = carData.status || '대기중';

      if (currentStatus === '대기중') {
        statusBadge.classList.remove('hidden');
      } else {
        statusBadge.classList.add('hidden');
      }

      card.classList.add('flash-alert');
      setTimeout(() => { card.classList.remove('flash-alert'); }, 5000);
    }

    function playNotificationSound() {
      if (!isSoundOn) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance('차량이 입문 했습니다');
        utterance.lang = 'ko-KR';
        window.speechSynthesis.speak(utterance);
      }
    }

    function showDesktopNotification(carData) {
      if ("Notification" in window && Notification.permission === "granted") {
        if (notificationQueue.length >= 3) {
          const oldest = notificationQueue.shift();
          try { oldest.close(); } catch(e) {}
        }

        const noti = new Notification(`🚨 [신규 입문] ${carData.car_number || '차량'}`, {
          body: `운전자: ${carData.driver_name || '미기재'} | 연락처: ${carData.phone_number || '미기재'}`,
          icon: 'https://cdn-icons-png.flaticon.com/512/2555/2555013.png',
          requireInteraction: true
        });

        noti.onclick = (e) => { e.preventDefault(); window.focus(); };
        notificationQueue.push(noti);
      }
    }

    function startTitleFlash() {
      if (titleInterval) clearInterval(titleInterval);
      let isAlt = false;
      titleInterval = setInterval(() => {
        document.title = isAlt ? originalTitle : "🚨 [신규 입문!] 확인 필요";
        isAlt = !isAlt;
      }, 1000);
    }

    function stopTitleFlash() {
      if (titleInterval) {
        clearInterval(titleInterval);
        titleInterval = null;
        document.title = originalTitle;
      }
    }

    function renderData() {
      const tbody = document.getElementById('table-body');
      const query = document.getElementById('search-input').value.toLowerCase();

      let filtered = allRecords.filter(item => {
        const matchesStatus = currentStatusFilter === 'ALL' || item.status === currentStatusFilter;
        const matchesSearch = (item.car_number && item.car_number.toLowerCase().includes(query)) ||
                              (item.driver_name && item.driver_name.toLowerCase().includes(query)) ||
                              (item.phone_number && item.phone_number.toLowerCase().includes(query));
        return matchesStatus && matchesSearch;
      });

      // 가장 최근 입문 차량 정보 업데이트
      if (allRecords.length > 0) {
        const latestWaiting = allRecords.find(i => (i.status || '대기중') === '대기중') || allRecords[0];
        updateLatestCarCard(latestWaiting);
      }

      document.getElementById('stat-total').innerText = allRecords.length;
      document.getElementById('stat-waiting').innerText = allRecords.filter(i => (i.status || '대기중') === '대기중').length;
      document.getElementById('stat-completed').innerText = allRecords.filter(i => i.status === '출차완료').length;
      document.getElementById('stat-cancelled').innerText = allRecords.filter(i => i.status === '입문취소').length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-10 text-center text-slate-400 font-medium text-base">조회된 데이터가 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const timeStr = new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const status = item.status || '대기중';
        
        let statusBadge = '<span class="px-3 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-700">대기중</span>';
        if(status === '출차완료') statusBadge = '<span class="px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700">출차완료</span>';
        if(status === '입문취소') statusBadge = '<span class="px-3 py-1.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700">입문취소</span>';

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-4 text-center">
              <input type="checkbox" value="${item.id}" class="row-checkbox w-4 h-4 rounded border-slate-300 text-slate-900 focus:ring-slate-900 cursor-pointer">
            </td>
            <td class="p-4 font-mono text-slate-600 font-semibold text-base">${timeStr}</td>
            <td class="p-4 font-black text-slate-900 text-lg">${item.car_number || '-'}</td>
            <td class="p-4 font-bold text-slate-800 text-base">${item.driver_name || '-'}</td>
            <td class="p-4 text-slate-600 font-mono text-base font-medium">${item.phone_number || '-'}</td>
            <td class="p-4">${statusBadge}</td>
            <td class="p-4 text-center">
              ${status === '대기중' ? `
                <button onclick="updateStatus('${item.id}', '출차완료')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm">출차</button>
                <button onclick="updateStatus('${item.id}', '입문취소')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition ml-1">취소</button>
              ` : `<span class="text-xs text-slate-400 font-semibold">처리완료</span>`}
            </td>
          </tr>
        `;
      }).join('');
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.row-checkbox');
      checkboxes.forEach(cb => cb.checked = master.checked);
    }

    async function deleteSelectedRecords() {
      const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
      if (checkedBoxes.length === 0) {
        alert('삭제할 항목을 선택해 주세요.');
        return;
      }

      if (!confirm(`선택한 ${checkedBoxes.length}건의 데이터를 삭제하시겠습니까?`)) return;

      const selectedIds = Array.from(checkedBoxes).map(cb => cb.value);
      const { error } = await _supabase.from('dock_control').delete().in('id', selectedIds);

      if (error) alert('삭제 실패: ' + error.message);
      else fetchData();
    }

    async function updateStatus(id, newStatus) {
      const { error } = await _supabase.from('dock_control').update({ status: newStatus }).eq('id', id);
      if (error) alert('상태 변경 실패: ' + error.message);
      else fetchData();
    }

    function setStatusFilter(status) {
      currentStatusFilter = status;
      ['all', 'waiting', 'completed'].forEach(s => {
        const btn = document.getElementById(`filter-${s}`);
        if ((s === 'all' && status === 'ALL') || (s === 'waiting' && status === '대기중') || (s === 'completed' && status === '출차완료')) {
          btn.className = "px-4 py-2 rounded-lg bg-slate-900 text-white transition";
        } else {
          btn.className = "px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition";
        }
      });
      renderData();
    }

    function filterData() { renderData(); }

    function downloadExcel() {
      if(allRecords.length === 0) {
        alert('다운로드할 데이터가 없습니다.');
        return;
      }
      
      const excelData = allRecords.map(item => ({
        '입문일시': new Date(item.created_at).toLocaleString('ko-KR'),
        '차량번호': item.car_number || '-',
        '운전자 성함': item.driver_name || '-',
        '연락처': item.phone_number || '-',
        '상태': item.status || '대기중'
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "입문현황");

      const selectedDate = document.getElementById('date-filter').value;
      XLSX.writeFile(workbook, `차량입문현황_${selectedDate}.xlsx`);
    }
  </script>
</body>
</html>
