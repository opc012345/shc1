<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 차량입문 신청</title>
  
  <!-- 카카오톡 / 문자 링크 카드 미리보기 설정 (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="신흥정밀 차량입문 신청">
  <meta property="og:image" content="https://opc012345.github.io/shc1/favicon.ico">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .card { background: white; width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); padding: 24px; }

    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-logo {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: #c81e2b;
      color: white;
      font-weight: 900;
      font-size: 20px;
      font-style: italic;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      letter-spacing: -1px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(200, 30, 43, 0.3);
    }
    .brand-title { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .brand-sub { font-size: 13px; color: #64748b; }

    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 8px; }
    
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper i { position: absolute; left: 14px; color: #94a3b8; font-size: 15px; }
    .form-input { width: 100%; padding: 12px 14px 12px 42px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: #0f172a; }

    .btn-submit { width: 100%; background: #0f172a; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: #1e293b; }

    .btn-cancel { width: 100%; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-cancel:hover { background: #dc2626; }

    /* status view */
    .status-card { text-align: center; display: none; }
    .status-icon { width: 64px; height: 64px; background: #e0f2fe; color: #0284c7; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; margin: 0 auto 16px auto; }
    .status-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    .status-desc { font-size: 14px; color: #64748b; margin-bottom: 20px; line-height: 1.5; }

    .info-list { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; text-align: left; margin-bottom: 20px; }
    .info-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: #64748b; }
    .info-value { font-weight: 700; color: #0f172a; }
  </style>
</head>
<body>

  <div class="card">
    <!-- 신청 폼 -->
    <div id="formView">
      <div class="brand-header">
        <span class="brand-logo">SHC</span>
        <div class="brand-title">차량입문 신청</div>
        <div class="brand-sub">하차 및 출차를 위해 정보를 입력해 주세요.</div>
      </div>

      <div class="form-group">
        <label class="form-label">차량번호</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-truck"></i>
          <input type="text" id="carNum" class="form-input" placeholder="예: 80가 1234">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">운전자 성함</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="driverName" class="form-input" placeholder="성함을 입력하세요">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">연락처</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-phone"></i>
          <input type="tel" id="phoneNum" class="form-input" placeholder="010-0000-0000">
        </div>
      </div>

      <button class="btn-submit" onclick="submitForm()">입문 신청하기</button>
    </div>

    <!-- 대기 현황 화면 -->
    <div id="statusView" class="status-card">
      <div class="status-icon"><i class="fa-solid fa-clock"></i></div>
      <div class="status-title">입문 신청이 완료되었습니다</div>
      <div class="status-desc">담당자가 확인 중입니다.<br>하차가 완료될 때까지 잠시만 대기해 주세요.</div>

      <div class="info-list">
        <div class="info-row"><span class="info-label">차량번호</span><span class="info-value" id="dispCar"></span></div>
        <div class="info-row"><span class="info-label">운전자</span><span class="info-value" id="dispName"></span></div>
        <div class="info-row"><span class="info-label">연락처</span><span class="info-value" id="dispPhone"></span></div>
        <div class="info-row"><span class="info-label">접수상태</span><span class="info-value" style="color: #c2410c;">대기중</span></div>
      </div>

      <button class="btn-cancel" onclick="cancelRegistration()">입문 신청 취소</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hlhjmnsgqhysvilltfpf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentId = null;

    window.onload = function() {
      const savedId = localStorage.getItem('shc_dock_id');
      if (savedId) {
        currentId = savedId;
        checkMyStatus();
      }
    };

    async function submitForm() {
      const car = document.getElementById('carNum').value.trim();
      const name = document.getElementById('driverName').value.trim();
      const phone = document.getElementById('phoneNum').value.trim();

      if (!car || !name || !phone) {
        alert('모든 정보를 입력해 주세요.');
        return;
      }

      const { data, error } = await _supabase
        .from('dock_control')
        .insert([{ car_number: car, driver_name: name, phone_number: phone, status: '대기중' }])
        .select();

      if (error) {
        alert('신청 실패: ' + error.message);
      } else if (data && data.length > 0) {
        currentId = data[0].id;
        localStorage.setItem('shc_dock_id', currentId);
        showStatus(data[0]);
      }
    }

    async function checkMyStatus() {
      if (!currentId) return;

      const { data, error } = await _supabase
        .from('dock_control')
        .select('*')
        .eq('id', currentId)
        .single();

      if (error || !data || data.status === '출차완료' || data.status === '입문취소') {
        localStorage.removeItem('shc_dock_id');
        document.getElementById('formView').style.display = 'block';
        document.getElementById('statusView').style.display = 'none';
      } else {
        showStatus(data);
      }
    }

    function showStatus(item) {
      document.getElementById('formView').style.display = 'none';
      document.getElementById('statusView').style.display = 'block';
      document.getElementById('dispCar').innerText = item.car_number;
      document.getElementById('dispName').innerText = item.driver_name;
      document.getElementById('dispPhone').innerText = item.phone_number;
    }

    async function cancelRegistration() {
      if (!confirm('정말 신청을 취소하시겠습니까?')) return;

      const { error } = await _supabase
        .from('dock_control')
        .update({ status: '입문취소' })
        .eq('id', currentId);

      if (!error) {
        localStorage.removeItem('shc_dock_id');
        alert('신청이 취소되었습니다.');
        location.reload();
      }
    }
  </script>
</body>
</html>
