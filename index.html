<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 - 차량 입문 등록</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-3xl shadow-xl overflow-hidden border border-slate-200">
    <!-- Header (요청 문구 삭제 반영) -->
    <div class="bg-slate-900 text-white p-6 text-center relative">
      <div class="w-12 h-12 bg-red-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-red-600/30">
        <span class="text-white font-black italic text-lg tracking-tighter">SHC</span>
      </div>
      <h1 class="text-xl font-bold tracking-tight">신흥정밀 차량 입문 등록</h1>
      <p class="text-xs text-slate-300 mt-2 leading-relaxed">
        접수 후 잠시만 기다려 주시면 관제 담당자가 확인 후 안내해 드립니다.
      </p>
    </div>

    <!-- Form Section -->
    <form id="entryForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">차량 번호 <span class="text-red-500">*</span></label>
        <input type="text" id="carNum" required placeholder="예: 12가 3456" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-red-500 font-semibold text-slate-800">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">운전자 성함 <span class="text-red-500">*</span></label>
        <input type="text" id="driverName" required placeholder="홍길동" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-red-500 font-semibold text-slate-800">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">연락처 <span class="text-red-500">*</span></label>
        <input type="tel" id="driverPhone" required placeholder="010-0000-0000" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-red-500 font-semibold text-slate-800">
      </div>

      <button type="submit" id="submitBtn" class="w-full py-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-2xl text-base transition shadow-lg shadow-red-500/25 mt-2">
        입문 신청하기
      </button>
    </form>

    <!-- Status Check Button -->
    <div class="px-6 pb-6 text-center">
      <button type="button" onclick="openSearchModal()" class="text-xs text-slate-500 hover:text-slate-800 font-semibold underline underline-offset-4">
        <i class="fa-solid fa-magnifying-glass mr-1"></i>내 입문 현황 / 취소 조회하기
      </button>
    </div>
  </div>

  <!-- Search Modal -->
  <div id="searchModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-base font-bold text-slate-900">입문 현황 조회 및 취소</h3>
        <button onclick="closeSearchModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <!-- 본인 확인 입력 영역 -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">차량 번호 <span class="text-red-500">*</span></label>
          <input type="text" id="searchCarNum" placeholder="예: 12가 3456" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-slate-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">연락처 뒤 4자리 <span class="text-red-500">*</span></label>
          <input type="text" maxlength="4" id="searchPhoneSuffix" placeholder="예: 1234" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-slate-400">
        </div>
        <button onclick="fetchMyStatusList()" class="w-full py-3 bg-slate-800 text-white font-bold rounded-xl text-xs hover:bg-slate-700 transition shadow-md">
          조회하기
        </button>
      </div>

      <!-- Result List Area -->
      <div id="searchResultArea" class="hidden space-y-2 pt-2 border-t border-slate-100 max-h-60 overflow-y-auto">
        <!-- JS 동적 렌더링 -->
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hlhjmnsgqhysvilltfpf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // 1. 입문 신청
    async function handleFormSubmit(e) {
      e.preventDefault();
      const carNum = document.getElementById('carNum').value.trim();
      const driverName = document.getElementById('driverName').value.trim();
      const driverPhone = document.getElementById('driverPhone').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      if (!carNum || !driverName || !driverPhone) {
        alert('모든 필수 항목을 입력해 주세요.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "접수 처리 중...";

      const { data, error } = await supabase
        .from('entry_logs')
        .insert([
          {
            car_num: carNum,
            driver_name: driverName,
            driver_phone: driverPhone,
            status: '구역 내 대기',
            entry_time: new Date().toISOString()
          }
        ]);

      if (error) {
        alert('접수 중 오류가 발생했습니다: ' + error.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "입문 신청하기";
      } else {
        alert('성공적으로 입문 접수되었습니다.');
        document.getElementById('entryForm').reset();
        submitBtn.disabled = false;
        submitBtn.innerText = "입문 신청하기";
      }
    }

    function openSearchModal() {
      document.getElementById('searchModal').classList.remove('hidden');
    }

    function closeSearchModal() {
      document.getElementById('searchModal').classList.add('hidden');
      document.getElementById('searchResultArea').classList.add('hidden');
    }

    // 2. 최근 30일 입문 현황 조회 (RPC)
    async function fetchMyStatusList() {
      const carNum = document.getElementById('searchCarNum').value.trim();
      const phoneSuffix = document.getElementById('searchPhoneSuffix').value.trim();

      if (!carNum || phoneSuffix.length !== 4) {
        alert('차량 번호와 연락처 뒤 4자리를 정확히 입력해 주세요.');
        return;
      }

      const { data, error } = await supabase.rpc('get_driver_entry_status_list', {
        search_car_num: carNum,
        search_phone_suffix: phoneSuffix
      });

      const resultArea = document.getElementById('searchResultArea');
      resultArea.classList.remove('hidden');

      if (error) {
        resultArea.innerHTML = `<p class="text-xs text-rose-500 text-center py-2">조회 중 오류 발생: ${escapeHtml(error.message)}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        resultArea.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">일치하는 입문 기록이 없습니다.</p>`;
        return;
      }

      resultArea.innerHTML = data.map(item => {
        const isWaiting = (item.status || '').includes('대기');
        let badgeClass = 'bg-amber-100 text-amber-700';
        if (item.status.includes('출차')) badgeClass = 'bg-emerald-100 text-emerald-700';
        if (item.status.includes('취소')) badgeClass = 'bg-rose-100 text-rose-700';

        const cancelBtn = isWaiting ? `
          <button onclick="cancelMyEntry(${item.id})" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-[11px] font-bold border border-rose-200 transition">
            취소
          </button>
        ` : '';

        return `
          <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between">
            <div>
              <div class="text-xs font-bold text-slate-800">${escapeHtml(item.car_num)} <span class="text-[10px] font-normal text-slate-400">(${new Date(item.created_at).toLocaleDateString()})</span></div>
              <div class="mt-1"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${badgeClass}">${escapeHtml(item.status)}</span></div>
            </div>
            ${cancelBtn}
          </div>
        `;
      }).join('');
    }

    // 3. 입문 취소 (RPC)
    async function cancelMyEntry(id) {
      if (!confirm('입문 신청을 취소하시겠습니까?')) return;

      const carNum = document.getElementById('searchCarNum').value.trim();
      const phoneSuffix = document.getElementById('searchPhoneSuffix').value.trim();

      const { data: success, error } = await supabase.rpc('cancel_driver_entry', {
        target_id: id,
        search_car_num: carNum,
        search_phone_suffix: phoneSuffix
      });

      if (error) {
        alert('취소 실패: ' + error.message);
      } else if (success) {
        alert('성공적으로 입문이 취소되었습니다.');
        fetchMyStatusList();
      } else {
        alert('취소에 실패했습니다. (이미 처리되었거나 권한이 없습니다.)');
      }
    }
  </script>
</body>
</html>
