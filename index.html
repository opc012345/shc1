<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 도크 입문 신청</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    div { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>🚚 신흥정밀 도크 입문 신청</h2>
  <form id="dockForm">
    <div>
      <label>차량 번호</label>
      <input type="text" id="carNumber" placeholder="예: 12가 3456" required>
    </div>
    <div>
      <label>운전자 성함</label>
      <input type="text" id="driverName" placeholder="성함을 입력하세요" required>
    </div>
    <div>
      <label>연락처</label>
      <input type="tel" id="phoneNumber" placeholder="010-0000-0000" required>
    </div>
    <button type="submit">입문 신청하기</button>
  </form>

  <script>
    const SUPABASE_URL = "https://hlhjmnsgqhysvilltfpf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('dockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const carNumber = document.getElementById('carNumber').value;
      const driverName = document.getElementById('driverName').value;
      const phoneNumber = document.getElementById('phoneNumber').value;

      const { data, error } = await _supabase
        .from('dock_control')
        .insert([{ car_number: carNumber, driver_name: driverName, phone_number: phoneNumber, status: '대기중' }]);

      if (error) {
        alert('접수 중 오류가 발생했습니다: ' + error.message);
      } else {
        alert('입문 신청이 정상적으로 접수되었습니다.');
        document.getElementById('dockForm').reset();
      }
    });
  </script>
</body>
</html>
