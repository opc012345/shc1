<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 차량 입문 등록</title>
  <!-- 기사용 독립 매니페스트 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#dc2626">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

  <div class="max-w-md w-full mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-between p-4">
    <div>
      <!-- 로고 영역 -->
      <div class="flex justify-center my-4">
        <div class="w-16 h-16 bg-red-700 rounded-full flex items-center justify-center text-white font-bold text-xl tracking-tighter shadow-md">
          SHC
        </div>
      </div>

      <h1 class="text-xl font-bold text-center text-gray-900 mb-4">신흥정밀 차량 입문 등록 안내</h1>

      <!-- PWA 설치 안내 전체 영역 -->
      <div id="pwa-install-wrapper" class="mb-4">
        <!-- 스마트팁 배너 -->
        <div id="smart-tip-card" class="bg-amber-100 border border-amber-300 rounded-lg p-3 text-center mb-2 shadow-sm">
          <p class="text-xs text-amber-800 font-semibold mb-2">💡 자주 오시는 기사님을 위한 스마트 팁!</p>
          <button onclick="installPWA()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-lg text-sm shadow transition duration-150 flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i> 클릭 한 번으로 바탕화면에 앱 설치
          </button>
        </div>

        <!-- 수동 설치 안내 버튼 -->
        <div id="manual-guide-btn" onclick="alert('우측 상단 메뉴(⋮) -> [앱 설치] 또는 [홈 화면에 추가]를 선택해 주세요.')" class="bg-slate-100 border border-slate-200 rounded-lg p-3 flex justify-between items-center cursor-pointer text-slate-700 hover:bg-slate-200 transition">
          <span class="text-xs font-bold"><i class="fa-solid fa-mobile-screen-button mr-1"></i> 아이폰 / 수동 설치 방법 안내</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </div>
      </div>

      <!-- 본문 안내 사항 -->
      <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 space-y-3 text-sm text-gray-800">
        <div class="flex items-start gap-2">
          <span class="bg-red-600 text-white font-bold rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mt-0.5">1</span>
          <p class="font-semibold">보안실 접수 없이 바로 통록해 주세요.</p>
        </div>
        <div class="flex items-start gap-2">
          <span class="bg-red-600 text-white font-bold rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mt-0.5">2</span>
          <p class="font-semibold">지정된 장소에 주차 후 반드시 입문 등록을 해주세요.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let deferredPrompt = null;

    // PWA 설치 준비 신호 수신
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      checkEnvironmentAndToggleTips();
    });

    // 접속 환경 감지 및 배너 제어
    function checkEnvironmentAndToggleTips() {
      const ua = navigator.userAgent.toLowerCase();
      
      const isMobile = /iphone|ipad|ipod|android/i.test(ua);
      const isAndroid = /android/i.test(ua);
      const isKakao = ua.includes('kakaotalk');
      const isChrome = /chrome|crios/i.test(ua) && !/edg|opr|samsung/i.test(ua);
      
      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

      const smartTipCard = document.getElementById('smart-tip-card');
      const manualGuideBtn = document.getElementById('manual-guide-btn');
      const installWrapper = document.getElementById('pwa-install-wrapper');

      // 조건 1: PC 접속 시 OR 어플(홈 화면 추가) 접속 시 ➔ 스마트팁 ❌ / 아이폰 수동 ❌ (배너 전체 숨김)
      if (!isMobile || isStandalone) {
        if (installWrapper) installWrapper.style.display = 'none';
        return;
      }

      // 조건 2: 모바일 안드로이드 크롬 접속 시 (카카오톡 제외) ➔ 스마트팁 ⭕ / 아이폰 수동 ⭕ (둘 다 표시)
      if (isAndroid && isChrome && !isKakao) {
        if (installWrapper) installWrapper.style.display = 'block';
        if (smartTipCard) smartTipCard.style.display = 'block';
        if (manualGuideBtn) manualGuideBtn.style.display = 'flex';
      } 
      // 조건 3: 모바일 카카오톡 / 아이폰 접속 시 ➔ 스마트팁 ❌ / 아이폰 수동 ⭕ (수동 안내만 표시)
      else {
        if (installWrapper) installWrapper.style.display = 'block';
        if (smartTipCard) smartTipCard.style.display = 'none';
        if (manualGuideBtn) manualGuideBtn.style.display = 'flex';
      }
    }

    // 스마트팁 버튼 클릭 시 호출 함수
    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            const installWrapper = document.getElementById('pwa-install-wrapper');
            if (installWrapper) installWrapper.style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        alert('앱 설치 준비 중입니다. 1~2초 후 다시 눌러주세요.');
      }
    }

    window.addEventListener('DOMContentLoaded', checkEnvironmentAndToggleTips);
  </script>
</body>
</html>
