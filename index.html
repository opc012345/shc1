<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚛 [신흥정밀] 차량 상하차 안내</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="🚛 [신흥정밀] 차량 입문 등록 안내">
  <meta property="og:description" content="※ 고정 기사님도 방문 시마다 매번 입문 등록을 해주세요.">
  <meta property="og:image" content="https://opc012345.github.io/shc1/map.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background-color: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 16px; }
    
    .container { background: #ffffff; width: 100%; max-width: 460px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 28px 20px; margin-top: 10px; margin-bottom: 20px; }
    
    .header-logo { text-align: center; margin-bottom: 12px; }
    .shc-logo {
      display: inline-flex; justify-content: center; align-items: center; background: #c81e2b; color: white;
      font-weight: 900; font-size: 16px; font-style: italic; width: 56px; height: 56px; border-radius: 50%;
      letter-spacing: -0.5px; box-shadow: 0 2px 6px rgba(200, 30, 43, 0.3);
    }
    .header-title { font-size: 26px; font-weight: 800; color: #0f172a; text-align: center; margin-bottom: 16px; word-break: keep-all; }
    
    .header-guide-box { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 18px 16px; margin-bottom: 18px; text-align: left; }
    
    /* 1, 2번 핵심 안내 문구 */
    .header-sub-main { font-size: 16px; color: #0f172a; font-weight: 800; margin-bottom: 14px; line-height: 1.6; word-break: keep-all; display: flex; flex-direction: column; gap: 8px; }
    
    .main-step { 
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px;
      align-items: start;
    }
    .step-num { color: #dc2626; flex-shrink: 0; }
    
    /* 🔹 모바일/PC 완벽 수직 정렬 (Grid 레이아웃) */
    .header-sub-list { 
      font-size: 13.5px; 
      color: #334155; 
      line-height: 1.5; 
      margin-bottom: 14px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      background: #ffffff; 
      padding: 12px; 
      border-radius: 8px; 
      border: 1px solid #edf2f7; 
    }
    .list-item { 
      display: grid; 
      grid-template-columns: auto 1fr; 
      gap: 6px; 
      align-items: start; 
    }
    .list-item .label-group {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .list-item .icon { font-size: 11px; }
    .list-item .label { font-weight: 700; color: #1e293b; }
    .list-item .desc { 
      color: #334155; 
      font-weight: 500; 
      word-break: keep-all; 
    }

    /* 🚨 하단 경고문 수직 정렬 (Grid 레이아웃) */
    .header-sub-notice { 
      font-size: 13px; 
      color: #dc2626; 
      line-height: 1.5; 
      font-weight: 700; 
      border-top: 1px dashed #cbd5e1; 
      padding-top: 12px; 
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notice-item { 
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px;
      align-items: start;
    }
    .notice-icon {
      font-size: 13px;
      line-height: 1.5;
    }
    .notice-text {
      word-break: keep-all;
    }
    .notice-sub {
      color: #dc2626;
      font-size: 12.5px;
      margin-top: 2px;
      word-break: keep-all;
    }

    .accordion-toggle {
      width: 100%; padding: 14px 16px; background-color: #f1f5f9; color: #1e293b; border: 1.5px solid #cbd5e1;
      border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; margin-bottom: 20px; transition: all 0.2s;
    }
    .accordion-toggle:hover { background-color: #e2e8f0; }
    .accordion-content { display: none; background: #fafafa; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-top: -12px; margin-bottom: 20px; }
    .accordion-content.show { display: block; }
    .contact-group { margin-bottom: 14px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 10px; }
    .contact-group:last-child { margin-bottom: 10px; border-bottom: none; padding-bottom: 0; }
    .contact-item { font-size: 14px; color: #334155; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .contact-item a { color: #dc2626; text-decoration: none; font-weight: bold; background: #fee2e2; padding: 6px 12px; border-radius: 8px; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
    
    .map-container { position: relative; cursor: pointer; margin-top: 10px; }
    .map-img { width: 100%; border-radius: 8px; border: 1px solid #e2e8f0; display: block; }
    .map-zoom-hint {
      position: absolute; bottom: 8px; right: 8px; background: rgba(15, 23, 42, 0.85); color: #fff;
      font-size: 12px; padding: 6px 10px; border-radius: 6px; pointer-events: none; backdrop-filter: blur(2px);
      display: flex; align-items: center; gap: 4px; font-weight: 600;
    }

    .form-group { margin-bottom: 18px; }
    .label-title { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .label-title i { color: #dc2626; }
    .required { color: #dc2626; }

    .input-wrapper { position: relative; display: flex; align-items: center; }
