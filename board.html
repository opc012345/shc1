<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 차량 현황판</title>
  <!-- 현장용 독립 매니페스트 -->
  <link rel="manifest" href="board-manifest.json">
  <meta name="theme-color" content="#020617">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen">

  <div class="max-w-md w-full mx-auto min-h-screen flex flex-col justify-between p-4">
    <div>
      <!-- 상단 헤더 -->
      <div class="flex justify-between items-center my-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center text-white font-bold text-xs">
            SHC
          </div>
          <h1 class="text-lg font-bold">신흥정밀 차량 현황판</h1>
        </div>
        <span class="bg-emerald-950 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-800/50 flex items-center gap-1 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> 실시간 연결됨
        </span>
      </div>

      <!-- PWA 설치 안내 영역 -->
      <div id="pwa-install-wrapper" class="mb-4">
        <!-- 스마트팁 배너 -->
        <div id="smart-tip-card" class="bg-slate-900 border border-amber-500/50 rounded-xl p-3 text-center mb-2 shadow-lg">
          <p class="text-xs text-amber-400 font-semibold mb-2">💡 현황판 담당자 전용 스마트 팁!</p>
          <button onclick="installPWA()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 px-4 rounded-lg text-sm shadow transition duration-150 flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i> 클릭 한 번으로 현황판 앱 설치
          </button>
        </div>

        <!-- 수동 설치 안내 버튼 -->
        <div id="manual-guide-btn" onclick="alert('우측 상단 메뉴(⋮) -> [앱 설치] 또는 [홈 화면에 추가]를 선택해 주세요.')" class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex justify-between items-center cursor-pointer text-slate-400 hover:bg-slate-800 transition">
          <span class="text-xs font-medium"><i class="fa-solid fa-mobile-screen-button mr-1"></i> 아이폰 / 수동 설치 방법 안내</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </div>
      </div>

      <!-- 대기 차량 현황 카드리스트 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-base font-bold flex items-center gap-2">
            <span class="text-xl">🚛</span> 입문 대기 차량
          </h2>
          <span class="text-xs text-slate-400">총 <strong class="text-amber-400 font-bold">0</strong> 대 대기 중</span>
        </div>

        <div class="py-8 text-center text-slate-500 text-sm">
          현재 입문 대기 중인 차량이 없습니다.
        </div>
      </div>
    </div>
  </div>

  <script>
    let deferredPrompt = null;

    // PWA 설치 준비 신호 수신
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      checkEnvironmentAndToggleTips();
    });

    // 접속 환경 감지 및 배너 제어 (요청하신 조건 100% 반영)
    function checkEnvironmentAndToggleTips() {
      const ua = navigator.userAgent.toLowerCase();
      
      const isMobile = /iphone|ipad|ipod|android/i.test(ua);
      const isAndroid = /android/i.test(ua);
      const isKakao = ua.includes('kakaotalk');
      const isChrome = /chrome|crios/i.test(ua) && !/edg|opr|samsung/i.test(ua);
      
      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

      const smartTipCard = document.getElementById('smart-tip-card');
      const manualGuideBtn = document.getElementById('manual-guide-btn');
      const installWrapper = document.getElementById('pwa-install-wrapper');

      // 조건 1: PC 접속 시 OR 어플(홈 화면 추가) 접속 시 ➔ 배너 전체 숨김
      if (!isMobile || isStandalone) {
        if (installWrapper) installWrapper.style.display = 'none';
        return;
      }

      // 조건 2: 모바일 안드로이드 크롬 접속 시 (카카오톡 제외) ➔ 둘 다 표시
      if (isAndroid && isChrome && !isKakao) {
        if (installWrapper) installWrapper.style.display = 'block';
        if (smartTipCard) smartTipCard.style.display = 'block';
        if (manualGuideBtn) manualGuideBtn.style.display = 'flex';
      } 
      // 조건 3: 모바일 카카오톡 / 아이폰 접속 시 ➔ 수동 안내만 표시
      else {
        if (installWrapper) installWrapper.style.display = 'block';
        if (smartTipCard) smartTipCard.style.display = 'none';
        if (manualGuideBtn) manualGuideBtn.style.display = 'flex';
      }
    }

    // 스마트팁 버튼 클릭 시 호출 함수
    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            const installWrapper = document.getElementById('pwa-install-wrapper');
            if (installWrapper) installWrapper.style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        alert('앱 설치 준비 중입니다. 1~2초 후 다시 눌러주세요.');
      }
    }

    window.addEventListener('DOMContentLoaded', checkEnvironmentAndToggleTips);
  </script>
</body>
</html>
