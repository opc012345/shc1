<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 - 실시간 차량 대기 현황판</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-bg {
      0%, 100% { background-color: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.8); }
      50% { background-color: rgba(245, 158, 11, 0.05); border-color: rgba(245, 158, 11, 0.3); }
    }
    .highlight-card { animation: pulse-bg 2s infinite; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans overflow-hidden select-none" onclick="enableAudio()">

  <!-- 헤더 (상단) -->
  <header class="bg-slate-900 border-b border-slate-800 px-8 py-5 flex justify-between items-center shadow-2xl">
    <div class="flex items-center gap-4">
      <span class="bg-red-600 text-white font-black text-xl px-3 py-1 rounded-lg tracking-wider">SHC</span>
      <h1 class="text-3xl font-black tracking-tight text-white">실시간 차량 대기 현황판</h1>
      <span id="realtime-status" class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/30 font-bold ml-2">실시간 연결됨</span>
    </div>

    <div class="flex items-center gap-8">
      <div class="text-right font-mono">
        <p id="clock-date" class="text-slate-400 text-sm font-semibold"></p>
        <p id="clock-time" class="text-2xl font-bold text-amber-400 tracking-wider"></p>
      </div>
      <div class="bg-slate-800/80 border border-slate-700 px-6 py-2.5 rounded-2xl flex items-center gap-3">
        <span class="text-xs text-slate-400 font-bold uppercase">대기 차수</span>
        <span id="total-waiting-count" class="text-3xl font-black text-amber-400 font-mono">0</span>
        <span class="text-sm font-bold text-slate-400">대</span>
      </div>
    </div>
  </header>

  <!-- 메인 현황 영역 -->
  <main class="flex-1 p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 overflow-y-auto no-scrollbar" id="display-container">
    <div class="col-span-full flex flex-col items-center justify-center h-full text-slate-500 space-y-4">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-amber-500"></i>
      <p class="text-xl font-bold">실시간 입문 데이터를 불러오는 중입니다...</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i';

    let _supabase = null;
    let audioEnabled = false;

    window.onload = () => {
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      startClock();
      fetchWaitingData();
      subscribeRealtime();
    };

    function enableAudio() {
      if (!audioEnabled) {
        audioEnabled = true;
        if ('speechSynthesis' in window) {
          const test = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(test);
        }
      }
    }

    function startClock() {
      const update = () => {
        const now = new Date();
        document.getElementById('clock-date').innerText = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
        document.getElementById('clock-time').innerText = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      };
      update();
      setInterval(update, 1000);
    }

    async function fetchWaitingData() {
      if (!_supabase) return;
      
      const today = new Date().toISOString().split('T')[0];
      const start = `${today}T00:00:00`;
      const end = `${today}T23:59:59`;

      const { data, error } = await _supabase
        .from('dock_control')
        .select('*')
        .eq('status', '대기중')
        .gte('created_at', start)
        .lte('created_at', end)
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Fetch error:', error);
        return;
      }

      renderDisplay(data || []);
    }

    function subscribeRealtime() {
      if (!_supabase) return;
      const statusBadge = document.getElementById('realtime-status');

      _supabase
        .channel('public:dock_control')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'dock_control' }, (payload) => {
          if (payload.eventType === 'INSERT') {
            speakNewArrival(payload.new);
          }
          fetchWaitingData();
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            statusBadge.innerText = '실시간 연결됨';
            statusBadge.className = 'bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/30 font-bold ml-2';
          } else {
            statusBadge.innerText = '연결 끊김';
            statusBadge.className = 'bg-rose-500/20 text-rose-400 text-xs px-3 py-1 rounded-full border border-rose-500/30 font-bold ml-2';
          }
        });
    }

    function speakNewArrival(carData) {
      if (!audioEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const carNum = carData.car_number || '신규 차량';
      const utterance = new SpeechSynthesisUtterance(`${carNum} 입문 등록되었습니다.`);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    function renderDisplay(list) {
      const container = document.getElementById('display-container');
      document.getElementById('total-waiting-count').innerText = list.length;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-600 space-y-4">
            <i class="fa-solid fa-truck-dot text-6xl"></i>
            <p class="text-2xl font-bold">현재 구역 내 대기 중인 차량이 없습니다.</p>
          </div>`;
        return;
      }

      container.innerHTML = list.map((item, index) => {
        const isFirst = index === 0;
        const timeStr = new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="bg-slate-900 rounded-3xl border-2 ${isFirst ? 'highlight-card border-amber-500' : 'border-slate-800'} p-6 shadow-2xl flex flex-col justify-between relative overflow-hidden">
            <div>
              <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                <span class="text-sm font-black tracking-widest ${isFirst ? 'text-amber-400' : 'text-slate-400'} uppercase">
                  ${isFirst ? '🚨 다음 순서 (대기 #1)' : `대기 순번 #${index + 1}`}
                </span>
                <span class="text-xs font-mono bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">입문시간: ${timeStr}</span>
              </div>

              <div class="space-y-4">
                <div>
                  <p class="text-xs text-slate-400 font-bold uppercase mb-1">차량 번호</p>
                  <p class="text-4xl font-black text-white tracking-tight ${isFirst ? 'text-amber-300' : ''}">${item.car_number || '-'}</p>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-800/60">
                  <div>
                    <p class="text-xs text-slate-500 font-bold mb-1">운전자 성함</p>
                    <p class="text-xl font-bold text-slate-200">${item.driver_name || '-'}</p>
                  </div>
                  <div>
                    <p class="text-xs text-slate-500 font-bold mb-1">연락처</p>
                    <p class="text-sm font-mono font-semibold text-slate-400 mt-1">${item.phone_number || '-'}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>`;
      }).join('');
    }
  </script>
</body>
</html>
