<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚛 [신흥정밀] 현장 입문 관리 시스템</title>

  <!-- 현장 관리자 전용 PWA 매니페스트 연결 -->
  <link rel="manifest" href="./board-manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="신흥정밀 현장관리">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 16px; }
    
    .container { max-width: 800px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #334155; }
    .header-title { font-size: 20px; font-weight: 800; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
    .refresh-info { font-size: 12px; color: #94a3b8; text-align: right; }

    /* PWA 설치 유도 배너 */
    .pwa-install-banner {
      display: none; background: #1e293b; border: 1.5px solid #3b82f6; border-radius: 12px; padding: 12px; margin-bottom: 16px; text-align: center;
    }
    .pwa-install-banner.show { display: block; }
    .btn-pwa-install {
      width: 100%; background: #2563eb; color: #ffffff; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px;
    }

    .status-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .summary-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; text-align: center; }
    .summary-card .title { font-size: 12px; color: #94a3b8; font-weight: 600; }
    .summary-card .count { font-size: 22px; font-weight: 900; margin-top: 4px; }
    .count-wait { color: #f59e0b; }
    .count-done { color: #10b981; }
    .count-cancel { color: #ef4444; }

    .board-list { display: flex; flex-direction: column; gap: 12px; }
    .board-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .card-time { font-family: monospace; font-size: 13px; color: #94a3b8; }
    
    .badge-status { padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 700; }
    .badge-wait { background-color: #78350f; color: #fef3c7; }
    .badge-done { background-color: #064e3b; color: #d1fae5; }
    .badge-cancel { background-color: #881337; color: #ffe4e6; }

    .card-middle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .info-car { font-size: 18px; font-weight: 900; color: #ffffff; }
    .info-driver { font-size: 15px; font-weight: 700; color: #cbd5e1; }
    .info-phone { font-size: 14px; font-family: monospace; color: #38bdf8; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; }

    .card-actions { display: flex; gap: 8px; border-top: 1px solid #334155; padding-top: 12px; }
    .btn-action { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-done { background: #059669; color: white; }
    .btn-done:active { background: #047857; }
    .btn-reset { background: #475569; color: white; }

    .empty-msg { text-align: center; color: #94a3b8; font-size: 14px; padding: 40px 0; background: #1e293b; border-radius: 12px; border: 1px dashed #334155; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header">
      <div class="header-title">
        <i class="fa-solid fa-list-check" style="color: #38bdf8;"></i> 현장 입문 관리
      </div>
      <div class="refresh-info">
        <div id="lastCheckTime">최종 동기화: --:--</div>
        <div style="color: #38bdf8; margin-top: 2px;">10초 주기 자동 갱신</div>
      </div>
    </div>

    <!-- PWA 설치 배너 (안드로이드 크롬 접속 시만 표시) -->
    <div class="pwa-install-banner" id="pwaBanner">
      <button type="button" class="btn-pwa-install" id="btnPwaInstall">
        <i class="fa-solid fa-download"></i> 현장 관리자 전용 어플 설치
      </button>
    </div>

    <div class="status-summary">
      <div class="summary-card">
        <div class="title">대기중</div>
        <div class="count count-wait" id="cntWait">0</div>
      </div>
      <div class="summary-card">
        <div class="title">출차완료</div>
        <div class="count count-done" id="cntDone">0</div>
      </div>
      <div class="summary-card">
        <div class="title">입문취소</div>
        <div class="count count-cancel" id="cntCancel">0</div>
      </div>
    </div>

    <div class="board-list" id="boardList">
      <div class="empty-msg">오늘 접수된 차량 내역이 없습니다.</div>
    </div>

  </div>

  <script>
    var SUPABASE_URL = "https://hlhjmnsgqhysvilltfpf.supabase.co";
    var SUPABASE_KEY = "sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i";
    var _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* PWA 서비스 워커 등록 */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(err) {
          console.log('SW 등록 실패:', err);
        });
      });
    }

    var deferredPrompt = null;
    var ua = navigator.userAgent;
    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    var isChrome = /Chrome/i.test(ua) && !/KAKAOTALK/i.test(ua);
    var isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
    });

    window.onload = function() {
      var pwaBanner = document.getElementById('pwaBanner');
      if (pwaBanner) pwaBanner.classList.remove('show');

      if (isMobile && isAndroid && isChrome && !isStandalone) {
        if (pwaBanner) pwaBanner.classList.add('show');
      }

      fetchBoardData();
    };

    var btnPwaInstall = document.getElementById('btnPwaInstall');
    if (btnPwaInstall) {
      btnPwaInstall.addEventListener('click', async function() {
        if (!deferredPrompt) {
          alert("안드로이드 수동 설치 방법:\n1. 우측 상단 점 3개(⋮) 터치\n2. [앱 설치] 또는 [홈 화면에 추가] 선택");
          return;
        }
        deferredPrompt.prompt();
        var choiceResult = await deferredPrompt.userChoice;
        if (choiceResult.outcome === 'accepted') {
          var pwaBanner = document.getElementById('pwaBanner');
          if (pwaBanner) pwaBanner.classList.remove('show');
        }
        deferredPrompt = null;
      });
    }

    async function fetchBoardData() {
      var container = document.getElementById('boardList');
      var now = new Date();
      document.getElementById('lastCheckTime').innerText = "최종 동기화: " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      var todayStart = new Date();
      todayStart.setHours(0, 0, 0, 0);

      var res = await _supabase
        .from('dock_control')
        .select('*')
        .gte('created_at', todayStart.toISOString())
        .order('created_at', { ascending: false });

      if (res.error || !res.data || res.data.length === 0) {
        container.innerHTML = '<div class="empty-msg">오늘 접수된 차량 내역이 없습니다.</div>';
        updateSummary(0, 0, 0);
        return;
      }

      var waitCnt = 0, doneCnt = 0, cancelCnt = 0;
      container.innerHTML = '';

      res.data.forEach(function(item) {
        var dt = new Date(item.created_at);
        var timeStr = dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        var status = item.status || '대기중';
        var badgeClass = 'badge-wait';
        
        if (status === '대기중') waitCnt++;
        else if (status === '출차완료') { doneCnt++; badgeClass = 'badge-done'; }
        else if (status === '입문취소') { cancelCnt++; badgeClass = 'badge-cancel'; }

        var actionHtml = '';
        if (status === '대기중') {
          actionHtml = '<button class="btn-action btn-done" onclick="updateStatus(' + item.id + ', \'출차완료\')"><i class="fa-solid fa-check"></i> 출차 완료 처리</button>';
        } else {
          actionHtml = '<button class="btn-action btn-reset" onclick="updateStatus(' + item.id + ', \'대기중\')">대기 상태로 변경</button>';
        }

        var card = document.createElement('div');
        card.className = 'board-card';
        card.innerHTML = 
          '<div class="card-top">' +
            '<span class="card-time"><i class="fa-regular fa-clock"></i> ' + timeStr + ' 접수</span>' +
            '<span class="badge-status ' + badgeClass + '">' + status + '</span>' +
          '</div>' +
          '<div class="card-middle">' +
            '<div>' +
              '<div style="font-size:11px; color:#94a3b8;">차량번호</div>' +
              '<div class="info-car">' + (item.car_number || '-') + '</div>' +
            '</div>' +
            '<div>' +
              '<div style="font-size:11px; color:#94a3b8;">운전기사</div>' +
              '<div class="info-driver">' + (item.driver_name || '-') + '</div>' +
              '<a href="tel:' + item.phone_number + '" class="info-phone"><i class="fa-solid fa-phone"></i> ' + (item.phone_number || '-') + '</a>' +
            '</div>' +
          '</div>' +
          '<div class="card-actions">' + actionHtml + '</div>';
        
        container.appendChild(card);
      });

      updateSummary(waitCnt, doneCnt, cancelCnt);
    }

    function updateSummary(wait, done, cancel) {
      document.getElementById('cntWait').innerText = wait;
      document.getElementById('cntDone').innerText = done;
      document.getElementById('cntCancel').innerText = cancel;
    }

    async function updateStatus(id, newStatus) {
      var res = await _supabase
        .from('dock_control')
        .update({ status: newStatus })
        .eq('id', id);

      if (res.error) {
        alert('상태 변경 실패: ' + res.error.message);
      } else {
        fetchBoardData();
      }
    }

    setInterval(fetchBoardData, 10000);
  </script>
</body>
</html>
