<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 - 실시간 차량 대기 현황판</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-bg {
      0%, 100% { background-color: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.8); }
      50% { background-color: rgba(245, 158, 11, 0.05); border-color: rgba(245, 158, 11, 0.3); }
    }
    .highlight-card {
      animation: pulse-bg 2s infinite;
    }
    /* 스크롤바 숨기기 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans overflow-hidden select-none" onclick="enableAudio()">

  <!-- 헤더 (상단) -->
  <header class="bg-slate-900 border-b border-slate-800 px-8 py-5 flex justify-between items-center shadow-2xl">
    <div class="flex items-center gap-4">
      <span class="bg-red-600 text-white font-black text-xl px-3 py-1 rounded-lg tracking-wider">SHC</span>
      <h1 class="text-3xl font-black tracking-tight text-white">실시간 차량 대기 현황판</h1>
      <span id="connection-status" class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-bold ml-2">연결 확인 중...</span>
    </div>
    
    <div class="flex items-center gap-8">
      <div id="audio-notice" class="text-xs text-amber-400 bg-amber-950/50 border border-amber-800 px-3 py-1.5 rounded-lg flex items-center gap-2">
        <i class="fa-solid fa-volume-high animate-bounce"></i> 화면을 클릭하면 음성 알림이 활성화됩니다.
      </div>
      <div id="current-clock" class="text-3xl font-mono font-bold text-slate-300">00:00:00</div>
    </div>
  </header>

  <!-- 메인 디스플레이 영역 -->
  <main class="flex-1 grid grid-cols-12 gap-6 p-6 overflow-hidden">

    <!-- 좌측: 현재 구역 내 대기중 차량 (7열 차지) -->
    <section class="col-span-7 bg-slate-900/80 rounded-3xl border border-slate-800 p-6 flex flex-col shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
        <div class="flex items-center gap-3">
          <div class="w-4 h-8 bg-amber-500 rounded-full"></div>
          <h2 class="text-2xl font-black text-slate-100">입고 대기 차량</h2>
        </div>
        <span class="text-lg font-bold text-slate-400">총 <span id="waiting-count" class="text-3xl font-black text-amber-400 mx-1">0</span>대 대기 중</span>
      </div>

      <!-- 대기 카드 목록 -->
      <div id="waiting-list" class="flex-1 space-y-4 overflow-y-auto no-scrollbar pr-1">
        <!-- 동적 생성 카드가 들어가는 자리 -->
      </div>
    </section>

    <!-- 우측: 상태 요약 & 최근 출문 완료 차량 (5열 차지) -->
    <section class="col-span-5 flex flex-col gap-6">
      
      <!-- 상단 현황 수치 요약 -->
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase">금일 총 입문</p>
            <p id="stat-total" class="text-4xl font-black text-slate-100 mt-1">0</p>
          </div>
          <div class="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center text-2xl"><i class="fa-solid fa-truck"></i></div>
        </div>

        <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase">출문 완료</p>
            <p id="stat-completed" class="text-4xl font-black text-emerald-400 mt-1">0</p>
          </div>
          <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-2xl"><i class="fa-solid fa-circle-check"></i></div>
        </div>
      </div>

      <!-- 최근 출문 완료 목록 -->
      <div class="flex-1 bg-slate-900/80 rounded-3xl border border-slate-800 p-6 flex flex-col shadow-2xl overflow-hidden">
        <div class="flex items-center gap-3 border-b border-slate-800 pb-4 mb-4">
          <div class="w-4 h-8 bg-emerald-500 rounded-full"></div>
          <h2 class="text-2xl font-black text-slate-100">최근 출문 완료</h2>
        </div>

        <div id="completed-list" class="flex-1 space-y-3 overflow-y-auto no-scrollbar">
          <!-- 최근 출문 완료 목록 동적 생성 -->
        </div>
      </div>

    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i';

    let _supabase = null;
    let allRecords = [];
    let isAudioEnabled = false;

    window.onload = () => {
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      updateClock();
      setInterval(updateClock, 1000);

      fetchBoardData();
      subscribeRealtime();
    };

    function enableAudio() {
      if (!isAudioEnabled) {
        isAudioEnabled = true;
        const notice = document.getElementById('audio-notice');
        if (notice) {
          notice.className = "text-xs text-emerald-400 bg-emerald-950/50 border border-emerald-800 px-3 py-1.5 rounded-lg flex items-center gap-2";
          notice.innerHTML = `<i class="fa-solid fa-volume-high"></i> 음성 알림 활성화됨`;
        }
        speakTTS('음성 알림이 활성화되었습니다.');
      }
    }

    function speakTTS(text) {
      if ('speechSynthesis' in window && isAudioEnabled) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('current-clock').innerText = now.toLocaleTimeString('ko-KR', { hour12: false });
    }

    async function fetchBoardData() {
      if (!_supabase) return;

      const today = new Date().toISOString().split('T')[0];
      const start = `${today}T00:00:00`;
      const end = `${today}T23:59:59`;

      const { data, error } = await _supabase
        .from('dock_control')
        .select('*')
        .gte('created_at', start)
        .lte('created_at', end)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching data:', error);
        return;
      }

      allRecords = data || [];
      renderBoard();
    }

    function subscribeRealtime() {
      if (!_supabase) return;
      const statusBadge = document.getElementById('connection-status');

      _supabase
        .channel('public:board_control')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'dock_control' },
          (payload) => {
            if (payload.eventType === 'INSERT') {
              const newCar = payload.new;
              speakTTS(`신규 차량 입장. ${newCar.car_number || ''} 차량이 대기열에 등록되었습니다.`);
            } else if (payload.eventType === 'UPDATE') {
              const updated = payload.new;
              if (updated.status === '출문완료') {
                speakTTS(`${updated.car_number || ''} 차량, 출문 처리되었습니다.`);
              }
            }
            fetchBoardData();
          }
        )
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            statusBadge.innerText = '실시간 연결됨';
            statusBadge.className = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-bold ml-2';
          } else {
            statusBadge.innerText = '재연결 중...';
            statusBadge.className = 'bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs px-3 py-1 rounded-full font-bold ml-2';
          }
        });
    }

    function renderBoard() {
      const waitingList = allRecords.filter(i => (i.status || '대기중') === '대기중');
      const completedList = allRecords.filter(i => i.status === '출문완료');

      // 수치 업데이트
      document.getElementById('stat-total').innerText = allRecords.length;
      document.getElementById('stat-completed').innerText = completedList.length;
      document.getElementById('waiting-count').innerText = waitingList.length;

      // 1. 대기 목록 렌더링
      const waitingContainer = document.getElementById('waiting-list');
      if (waitingList.length === 0) {
        waitingContainer.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-600 py-16">
            <i class="fa-solid fa-truck-slate text-6xl mb-4"></i>
            <p class="text-xl font-bold">현재 입고 대기 중인 차량이 없습니다.</p>
          </div>
        `;
      } else {
        waitingContainer.innerHTML = waitingList.map((item, index) => {
          const timeStr = new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
          const isTop = index === 0;

          return `
            <div class="p-5 rounded-2xl border transition-all ${isTop ? 'highlight-card border-amber-500/80 bg-slate-900' : 'bg-slate-950/60 border-slate-800'} flex items-center justify-between">
              <div class="flex items-center gap-5">
                <span class="w-10 h-10 rounded-xl ${isTop ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'} font-black text-xl flex items-center justify-center shrink-0">
                  ${index + 1}
                </span>
                <div>
                  <div class="flex items-center gap-3">
                    <p class="text-3xl font-black text-amber-400 tracking-tight">${item.car_number || '-'}</p>
                    ${isTop ? '<span class="bg-amber-500 text-slate-950 text-xs font-black px-2 py-0.5 rounded">최우선 대기</span>' : ''}
                  </div>
                  <p class="text-base text-slate-400 font-bold mt-1">
                    운전자: <span class="text-slate-200">${item.driver_name || '-'}</span> | 
                    연락처: <span class="text-slate-300 font-mono">${item.phone_number || '-'}</span>
                  </p>
                </div>
              </div>
              <div class="text-right">
                <span class="text-xs font-bold text-slate-500 uppercase block">입문 시간</span>
                <span class="text-xl font-mono font-bold text-slate-300">${timeStr}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      // 2. 최근 출문 완료 목록 렌더링
      const completedContainer = document.getElementById('completed-list');
      if (completedList.length === 0) {
        completedContainer.innerHTML = `
          <div class="text-center text-slate-600 py-10 font-bold text-sm">출문 내역이 없습니다.</div>
        `;
      } else {
        completedContainer.innerHTML = completedList.slice(0, 6).map(item => {
          const timeStr = new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

          return `
            <div class="p-3.5 bg-slate-950/40 rounded-xl border border-slate-800/80 flex items-center justify-between text-sm">
              <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-check text-emerald-400"></i>
                <span class="font-black text-slate-200 text-lg">${item.car_number || '-'}</span>
                <span class="text-xs text-slate-400">(${item.driver_name || '-'})</span>
              </div>
              <span class="font-mono text-xs font-bold text-slate-500">${timeStr}</span>
            </div>
          `;
        }).join('');
      }
    }
  </script>
</body>
</html>
