<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 - 실시간 차량 대기 현황판</title>
  
  <!-- 모바일 어플 설치 지원 PWA 메타태그 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHC 현황판">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2555/2555013.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-bg {
      0%, 100% { background-color: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.8); }
      50% { background-color: rgba(245, 158, 11, 0.05); border-color: rgba(245, 158, 11, 0.3); }
    }
    .highlight-card {
      animation: pulse-bg 2s infinite;
    }
    /* 스크롤바 숨기기 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans select-none">

  <!-- 헤더 (상단) -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 md:px-8 py-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 shadow-2xl shrink-0">
    <div class="flex items-center gap-2 md:gap-4 flex-wrap">
      <span class="bg-red-600 text-white font-black text-lg md:text-xl px-2.5 py-1 rounded-lg tracking-wider">SHC</span>
      <h1 class="text-xl md:text-3xl font-black tracking-tight text-white">실시간 차량 대기 현황판</h1>
      <span id="connection-status" class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs px-2.5 py-1 rounded-full font-bold">연결 확인 중...</span>
      
      <!-- 앱 설치 버튼 (지원되는 환경에서 자동 노출) -->
      <button id="pwa-install-btn" onclick="installPWA()" class="hidden bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1 rounded-lg items-center gap-1.5 transition-all">
        <i class="fa-solid fa-download"></i> 앱 설치
      </button>
    </div>

    <div class="flex items-center justify-between w-full md:w-auto gap-4">
      <!-- 음성 알림 버튼 (해당 버튼 클릭 시에만 음성 활성화) -->
      <button id="audio-notice" onclick="enableAudio(event)" class="text-xs text-amber-400 bg-amber-950/50 border border-amber-800 px-2.5 py-1.5 rounded-lg flex items-center gap-2 hover:bg-amber-900/50 transition-all cursor-pointer">
        <i class="fa-solid fa-volume-high animate-bounce"></i> 버튼 클릭 시 음성 알림 활성화
      </button>
      <div id="current-clock" class="text-xl md:text-3xl font-mono font-bold text-slate-300">00:00:00</div>
    </div>
  </header>

  <!-- 메인 디스플레이 영역 -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6 p-4 md:p-6 overflow-y-auto lg:overflow-hidden">

    <!-- 좌측: 현재 구역 내 대기중 차량 -->
    <section class="lg:col-span-7 bg-slate-900/80 rounded-2xl md:rounded-3xl border border-slate-800 p-4 md:p-6 flex flex-col shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3 md:pb-4 md:mb-4">
        <div class="flex items-center gap-2 md:gap-3">
          <div class="w-3 h-6 md:w-4 md:h-8 bg-amber-500 rounded-full"></div>
          <h2 class="text-lg md:text-2xl font-black text-slate-100">입문 대기 차량</h2>
        </div>
        <span class="text-sm md:text-lg font-bold text-slate-400">총 <span id="waiting-count" class="text-xl md:text-3xl font-black text-amber-400 mx-1">0</span>대 대기 중</span>
      </div>

      <!-- 대기 카드 목록 -->
      <div id="waiting-list" class="flex-1 space-y-3 md:space-y-4 overflow-y-auto no-scrollbar pr-1 min-h-[160px]">
        <!-- 동적 생성 카드가 들어가는 자리 -->
      </div>
    </section>

    <!-- 우측: 상태 요약 & 최근 출문 완료 차량 -->
    <section class="lg:col-span-5 flex flex-col gap-4 md:gap-6">

      <!-- 상단 현황 수치 요약 -->
      <div class="grid grid-cols-2 gap-3 md:gap-4">
        <div class="bg-slate-900/80 border border-slate-800 p-4 md:p-5 rounded-2xl flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase">금일 총 입문</p>
            <p id="stat-total" class="text-2xl md:text-4xl font-black text-slate-100 mt-1">0</p>
          </div>
          <div class="w-10 h-10 md:w-12 md:h-12 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center text-xl md:text-2xl"><i class="fa-solid fa-truck"></i></div>
        </div>

        <div class="bg-slate-900/80 border border-slate-800 p-4 md:p-5 rounded-2xl flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase">출문 완료</p>
            <p id="stat-completed" class="text-2xl md:text-4xl font-black text-emerald-400 mt-1">0</p>
          </div>
          <div class="w-10 h-10 md:w-12 md:h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl md:text-2xl"><i class="fa-solid fa-circle-check"></i></div>
        </div>
      </div>

      <!-- 최근 출문 완료 목록 -->
      <div class="flex-1 bg-slate-900/80 rounded-2xl md:rounded-3xl border border-slate-800 p-4 md:p-6 flex flex-col shadow-2xl overflow-hidden min-h-[180px]">
        <div class="flex items-center gap-2 md:gap-3 border-b border-slate-800 pb-3 mb-3 md:pb-4 md:mb-4">
          <div class="w-3 h-6 md:w-4 md:h-8 bg-emerald-500 rounded-full"></div>
          <h2 class="text-lg md:text-2xl font-black text-slate-100">최근 출문 완료</h2>
        </div>

        <div id="completed-list" class="flex-1 space-y-2.5 md:space-y-3 overflow-y-auto no-scrollbar">
          <!-- 최근 출문 완료 목록 동적 생성 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 출문 처리 팝업 (모달) -->
  <div id="exit-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4" onclick="closeExitModal(event)">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl text-center" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-4 md:mb-6 border-b border-slate-800 pb-3 md:pb-4">
        <h3 class="text-xl md:text-2xl font-black text-white flex items-center gap-2 md:gap-3">
          <i class="fa-solid fa-truck-ramp-box text-amber-500"></i>
          출문 확인
        </h3>
        <button onclick="closeExitModal()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
      </div>

      <div class="py-4 md:py-6 mb-4 md:mb-6 bg-slate-950 rounded-2xl border border-slate-800">
        <p class="text-xs md:text-sm font-bold text-slate-400 mb-1 md:mb-2">선택된 차량 번호</p>
        <span id="modal-car-number" class="text-3xl md:text-4xl font-black text-amber-400 tracking-tight">-</span>
        <p class="text-xs text-slate-500 mt-2 md:mt-3">해당 차량을 출문 처리하시겠습니까?</p>
      </div>

      <div class="flex gap-3 md:gap-4">
        <button onclick="closeExitModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 md:py-4 rounded-xl text-base md:text-lg transition-all">
          취소
        </button>
        <button onclick="confirmExit()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 md:py-4 rounded-xl text-base md:text-lg shadow-lg shadow-emerald-900/50 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-check"></i> 출문 완료
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i';

    let _supabase = null;
    let allRecords = [];
    let isAudioEnabled = false;
    let selectedRecordId = null;
    let deferredPrompt = null;

    // --- PWA 앱 설치 이벤트 등록 ---
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('pwa-install-btn');
      if (installBtn) installBtn.classList.remove('hidden');
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted install prompt');
          }
          deferredPrompt = null;
          document.getElementById('pwa-install-btn').classList.add('hidden');
        });
      } else {
        alert("아이폰(iOS)은 사파리(Safari) 브라우저 하단 공유 버튼 클릭 후 '홈 화면에 추가'를 눌러주세요.");
      }
    }

    window.onload = () => {
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      updateClock();
      setInterval(updateClock, 1000);

      fetchBoardData();
      subscribeRealtime();
    };

    // --- 마스킹 처리 헬퍼 함수 ---
    function maskName(name) {
      if (!name || name === '-' || name === 'null') return '-';
      const str = String(name).trim();
      if (str.length <= 1) return str;
      if (str.length === 2) return str[0] + '*';
      return str.slice(0, -1) + '*';
    }

    function maskPhone(phone) {
      if (!phone || phone === '-' || phone === 'null') return '-';
      const str = String(phone).trim();
      const parts = str.split('-');
      if (parts.length === 3) {
        return `${parts[0]}-${parts[1]}-****`;
      }
      if (str.length === 11) {
        return str.slice(0, 3) + '-' + str.slice(3, 7) + '-****';
      }
      if (str.length > 4) {
        return str.slice(0, -4) + '****';
      }
      return str;
    }

    // --- 음성 알림 버튼 전용 클릭 함수 ---
    function enableAudio(event) {
      if (event) event.stopPropagation(); // 다른 이벤트와 격리

      if (!isAudioEnabled) {
        isAudioEnabled = true;
        const notice = document.getElementById('audio-notice');
        if (notice) {
          notice.className = "text-xs text-emerald-400 bg-emerald-950/50 border border-emerald-800 px-2.5 py-1.5 rounded-lg flex items-center gap-2 cursor-default";
          notice.innerHTML = `<i class="fa-solid fa-volume-high"></i> 음성 알림 활성화됨`;
        }
        speakTTS('음성 알림이 활성화되었습니다.');
      } else {
        speakTTS('음성 알림이 이미 활성화되어 있습니다.');
      }
    }

    function speakTTS(text) {
      if ('speechSynthesis' in window && isAudioEnabled) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('current-clock').innerText = now.toLocaleTimeString('ko-KR', { hour12: false });
    }

    async function fetchBoardData() {
      if (!_supabase) return;

      const today = new Date().toISOString().split('T')[0];
      const start = `${today}T00:00:00`;
      const end = `${today}T23:59:59`;

      const { data, error } = await _supabase
        .from('dock_control')
        .select('*')
        .gte('created_at', start)
        .lte('created_at', end)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching data:', error);
        return;
      }

      allRecords = data || [];
      renderBoard();
    }

    function subscribeRealtime() {
      if (!_supabase) return;
      const statusBadge = document.getElementById('connection-status');

      _supabase
        .channel('public:board_control')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'dock_control' },
          (payload) => {
            if (payload.eventType === 'INSERT') {
              const newCar = payload.new;
              speakTTS(`신규 차량 입장. ${newCar.car_number || ''} 차량이 대기열에 등록되었습니다.`);
            } else if (payload.eventType === 'UPDATE') {
              const updated = payload.new;
              if (updated.status === '출문완료') {
                speakTTS(`${updated.car_number || ''} 차량, 출문 처리되었습니다.`);
              }
            }
            fetchBoardData();
          }
        )
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            statusBadge.innerText = '실시간 연결됨';
            statusBadge.className = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-2.5 py-1 rounded-full font-bold';
          } else {
            statusBadge.innerText = '재연결 중...';
            statusBadge.className = 'bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs px-2.5 py-1 rounded-full font-bold';
          }
        });
    }

    function renderBoard() {
      const waitingList = allRecords.filter(i => (i.status || '대기중') === '대기중');
      const completedList = allRecords.filter(i => i.status === '출문완료');

      // 수치 업데이트
      document.getElementById('stat-total').innerText = allRecords.length;
      document.getElementById('stat-completed').innerText = completedList.length;
      document.getElementById('waiting-count').innerText = waitingList.length;

      // 1. 대기 목록 렌더링
      const waitingContainer = document.getElementById('waiting-list');
      if (waitingList.length === 0) {
        waitingContainer.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-600 py-10 md:py-16">
            <i class="fa-solid fa-truck text-4xl md:text-6xl mb-3 md:mb-4"></i>
            <p class="text-base md:text-xl font-bold">현재 입문 대기 중인 차량이 없습니다.</p>
          </div>
        `;
      } else {
        waitingContainer.innerHTML = waitingList.map((item, index) => {
          const timeStr = new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
          const isTop = index === 0;

          const maskedDriver = maskName(item.driver_name);
          const maskedPhone = maskPhone(item.phone_number);
          const carNum = item.car_number || '-';

          return `
            <div onclick="openExitModal('${item.id}', '${carNum}')" 
                 class="p-4 md:p-5 rounded-2xl border transition-all cursor-pointer hover:scale-[1.01] ${isTop ? 'highlight-card border-amber-500/80 bg-slate-900' : 'bg-slate-950/60 border-slate-800 hover:border-slate-700'} flex items-center justify-between gap-2">
              <div class="flex items-center gap-3 md:gap-5 min-w-0">
                <span class="w-8 h-8 md:w-10 md:h-10 rounded-xl ${isTop ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'} font-black text-base md:text-xl flex items-center justify-center shrink-0">
                  ${index + 1}
                </span>
                <div class="min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <p class="text-xl md:text-3xl font-black text-amber-400 tracking-tight truncate">${carNum}</p>
                    ${isTop ? '<span class="bg-amber-500 text-slate-950 text-[10px] md:text-xs font-black px-1.5 md:px-2 py-0.5 rounded shrink-0">최우선 대기</span>' : ''}
                  </div>
                  <p class="text-xs md:text-base text-slate-400 font-bold mt-0.5 md:mt-1 truncate">
                    <span class="text-slate-200">${maskedDriver}</span> | 
                    <span class="text-slate-300 font-mono">${maskedPhone}</span>
                  </p>
                </div>
              </div>
              <div class="text-right flex items-center gap-2 md:gap-4 shrink-0">
                <div>
                  <span class="text-[10px] md:text-xs font-bold text-slate-500 uppercase block">입문 시간</span>
                  <span class="text-sm md:text-xl font-mono font-bold text-slate-300">${timeStr}</span>
                </div>
                <div class="text-slate-500 text-base md:text-lg">
                  <i class="fa-solid fa-chevron-right"></i>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      // 2. 최근 출문 완료 목록 렌더링
      const completedContainer = document.getElementById('completed-list');
      if (completedList.length === 0) {
        completedContainer.innerHTML = `
          <div class="text-center text-slate-600 py-6 md:py-10 font-bold text-xs md:text-sm">출문 내역이 없습니다.</div>
        `;
      } else {
        completedContainer.innerHTML = completedList.slice(0, 6).map(item => {
          const timeStr = new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
          const maskedDriver = maskName(item.driver_name);

          return `
            <div class="p-3 md:p-3.5 bg-slate-950/40 rounded-xl border border-slate-800/80 flex items-center justify-between text-xs md:text-sm">
              <div class="flex items-center gap-2 md:gap-3 min-w-0">
                <i class="fa-solid fa-circle-check text-emerald-400 shrink-0"></i>
                <span class="font-black text-slate-200 text-base md:text-lg truncate">${item.car_number || '-'}</span>
                <span class="text-xs text-slate-400 truncate">(${maskedDriver})</span>
              </div>
              <span class="font-mono text-[10px] md:text-xs font-bold text-slate-500 shrink-0 ml-2">${timeStr}</span>
            </div>
          `;
        }).join('');
      }
    }

    // --- 모달 제어 함수 ---
    function openExitModal(id, carNumber) {
      selectedRecordId = id;
      document.getElementById('modal-car-number').innerText = carNumber;
      document.getElementById('exit-modal').classList.remove('hidden');
    }

    function closeExitModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('exit-modal').classList.add('hidden');
      selectedRecordId = null;
    }

    async function confirmExit() {
      if (!selectedRecordId || !_supabase) return;

      const { error } = await _supabase
        .from('dock_control')
        .update({ status: '출문완료' })
        .eq('id', selectedRecordId);

      if (error) {
        alert('출문 처리 중 오류가 발생했습니다: ' + error.message);
        return;
      }

      closeExitModal();
    }
  </script>
</body>
</html>
