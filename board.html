<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신흥정밀 - 실시간 차량 대기 현황판</title>

  <!-- PWA 모바일 앱 설치 지원 메타태그 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHC 현황판">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2555/2555013.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-bg {
      0%, 100% { background-color: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.8); }
      50% { background-color: rgba(245, 158, 11, 0.05); border-color: rgba(245, 158, 11, 0.3); }
    }
    .highlight-card { animation: pulse-bg 2s infinite; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans overflow-hidden select-none" onclick="enableAudio()">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 border-b border-slate-800 px-8 py-4 flex justify-between items-center shadow-xl">
    <div class="flex items-center gap-4">
      <span class="bg-red-600 text-white font-black text-xl px-3 py-1 rounded-lg tracking-wider">SHC</span>
      <h1 class="text-3xl font-black tracking-tight text-white">실시간 차량 대기 현황판</h1>
      <span id="realtime-status" class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/30 font-bold ml-2">실시간 연결됨</span>
    </div>

    <div class="flex items-center gap-6">
      <div id="audio-notice" class="bg-amber-500/20 text-amber-400 text-xs font-bold px-4 py-2 rounded-full border border-amber-500/30 flex items-center gap-2">
        <i class="fa-solid fa-volume-high"></i> 화면을 클릭하면 음성 알림이 활성화됩니다.
      </div>
      <div class="text-right font-mono flex items-center gap-3">
        <p id="clock-date" class="text-slate-400 text-sm font-semibold"></p>
        <p id="clock-time" class="text-3xl font-black text-amber-400 tracking-wider"></p>
      </div>
    </div>
  </header>

  <!-- 메인 2열 레이아웃 -->
  <main class="flex-1 p-6 grid grid-cols-12 gap-6 overflow-hidden">
    
    <!-- 좌측: 입문 대기 차량 (8열) -->
    <section class="col-span-8 bg-slate-900/60 border border-slate-800 rounded-3xl p-6 flex flex-col">
      <div class="flex justify-between items-center pb-4 border-b border-slate-800 mb-6">
        <div class="flex items-center gap-3">
          <span class="w-3 h-8 bg-amber-500 rounded-full"></span>
          <h2 class="text-2xl font-black">입문 대기 차량</h2>
        </div>
        <div class="text-slate-400 font-bold">
          총 <span id="waiting-count" class="text-amber-400 text-2xl font-mono font-black">0</span> 대 대기 중
        </div>
      </div>

      <div id="waiting-list" class="flex-1 overflow-y-auto no-scrollbar grid grid-cols-2 gap-4">
        <!-- 대기 카드가 여기에 로드됩니다 -->
      </div>
    </section>

    <!-- 우측: 요약 통계 및 최근 출문 완료 (4열) -->
    <section class="col-span-4 flex flex-col gap-6">
      
      <!-- 상단 요약 카운트 -->
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex justify-between items-center">
          <div>
            <p class="text-xs text-slate-400 font-bold mb-1">금일 총 입문</p>
            <p id="today-total-in" class="text-3xl font-black text-white font-mono">0</p>
          </div>
          <div class="bg-blue-600/20 text-blue-400 p-3 rounded-xl">
            <i class="fa-solid fa-truck text-2xl"></i>
          </div>
        </div>

        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex justify-between items-center">
          <div>
            <p class="text-xs text-slate-400 font-bold mb-1">출문 완료</p>
            <p id="today-total-out" class="text-3xl font-black text-emerald-400 font-mono">0</p>
          </div>
          <div class="bg-emerald-600/20 text-emerald-400 p-3 rounded-xl">
            <i class="fa-solid fa-circle-check text-2xl"></i>
          </div>
        </div>
      </div>

      <!-- 최근 출문 완료 리스트 -->
      <div class="flex-1 bg-slate-900/60 border border-slate-800 rounded-3xl p-6 flex flex-col">
        <div class="flex items-center gap-3 pb-4 border-b border-slate-800 mb-4">
          <span class="w-3 h-6 bg-emerald-500 rounded-full"></span>
          <h3 class="text-xl font-black">최근 출문 완료</h3>
        </div>

        <div id="completed-list" class="flex-1 overflow-y-auto no-scrollbar space-y-3">
          <!-- 출문 완료 내역이 여기에 로드됩니다 -->
        </div>
      </div>

    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i';

    let _supabase = null;
    let audioEnabled = false;

    window.onload = () => {
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      startClock();
      loadAllData();
      subscribeRealtime();
    };

    function enableAudio() {
      if (!audioEnabled) {
        audioEnabled = true;
        document.getElementById('audio-notice').style.display = 'none';
        if ('speechSynthesis' in window) {
          const test = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(test);
        }
      }
    }

    function startClock() {
      const update = () => {
        const now = new Date();
        document.getElementById('clock-date').innerText = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
        document.getElementById('clock-time').innerText = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      };
      update();
      setInterval(update, 1000);
    }

    async function loadAllData() {
      if (!_supabase) return;

      const today = new Date().toISOString().split('T')[0];
      const start = `${today}T00:00:00`;
      const end = `${today}T23:59:59`;

      // 오늘 생성된 모든 데이터 가져오기
      const { data, error } = await _supabase
        .from('dock_control')
        .select('*')
        .gte('created_at', start)
        .lte('created_at', end)
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Fetch Error:', error);
        return;
      }

      const allList = data || [];
      const waitingList = allList.filter(item => item.status === '대기중' || item.status === '입문');
      const completedList = allList.filter(item => item.status === '출문완료' || item.status === '출문');

      // 통계 업뎃
      document.getElementById('today-total-in').innerText = allList.length;
      document.getElementById('today-total-out').innerText = completedList.length;
      document.getElementById('waiting-count').innerText = waitingList.length;

      renderWaiting(waitingList);
      renderCompleted(completedList);
    }

    function subscribeRealtime() {
      if (!_supabase) return;
      const statusBadge = document.getElementById('realtime-status');

      _supabase
        .channel('public:dock_control')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'dock_control' }, (payload) => {
          if (payload.eventType === 'INSERT') {
            speakNewArrival(payload.new);
          }
          loadAllData();
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            statusBadge.innerText = '실시간 연결됨';
            statusBadge.className = 'bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/30 font-bold ml-2';
          } else {
            statusBadge.innerText = '연결 끊김';
            statusBadge.className = 'bg-rose-500/20 text-rose-400 text-xs px-3 py-1 rounded-full border border-rose-500/30 font-bold ml-2';
          }
        });
    }

    function speakNewArrival(carData) {
      if (!audioEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const carNum = carData.car_number || '신규 차량';
      const utterance = new SpeechSynthesisUtterance(`${carNum} 입문 등록되었습니다.`);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    function renderWaiting(list) {
      const container = document.getElementById('waiting-list');

      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-600 space-y-4">
            <i class="fa-solid fa-truck text-6xl"></i>
            <p class="text-xl font-bold">현재 입문 대기 중인 차량이 없습니다.</p>
          </div>`;
        return;
      }

      container.innerHTML = list.map((item, index) => {
        const isFirst = index === 0;
        const timeStr = new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="bg-slate-900 rounded-2xl border-2 ${isFirst ? 'highlight-card border-amber-500' : 'border-slate-800'} p-5 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-3">
                <span class="text-xs font-black ${isFirst ? 'text-amber-400' : 'text-slate-400'}">
                  ${isFirst ? '🚨 다음 순서' : `순번 #${index + 1}`}
                </span>
                <span class="text-xs font-mono text-slate-400">${timeStr}</span>
              </div>
              <p class="text-3xl font-black text-white mb-2">${item.car_number || '-'}</p>
              <div class="text-sm text-slate-400 font-semibold">
                <p>운전자: <span class="text-slate-200">${item.driver_name || '-'}</span></p>
                <p>연락처: <span class="text-slate-300 font-mono">${item.phone_number || '-'}</span></p>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function renderCompleted(list) {
      const container = document.getElementById('completed-list');

      if (list.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-12 text-slate-600 space-y-2">
            <p class="text-sm font-semibold">출문 완료 내역이 없습니다.</p>
          </div>`;
        return;
      }

      // 최근 출문 순으로 정렬
      const sorted = [...list].reverse();

      container.innerHTML = sorted.map(item => {
        const timeStr = item.updated_at ? new Date(item.updated_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '-';
        return `
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-circle-check text-emerald-400"></i>
              <span class="font-bold text-white">${item.car_number || '-'}</span>
              <span class="text-xs text-slate-400">(${item.driver_name || '-'})</span>
            </div>
            <span class="text-xs font-mono text-slate-500">${timeStr}</span>
          </div>`;
      }).join('');
    }
  </script>
</body>
</html>
