<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 차량 관리자 시스템</title>
  
  <!-- PWA 기본 메타태그 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHC 차량관리">
  
  <!-- SHC 원형 로고 아이콘 -->
  <link rel="apple-touch-icon" id="app-icon-apple" href="">
  <link rel="icon" id="app-icon-fav" href="">

  <!-- 동적 PWA Manifest 및 Service Worker 자동 생성 스크립트 -->
  <script>
    const shcLogoSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><circle cx="256" cy="256" r="256" fill="#dc2626"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-style="italic" font-size="190">SHC</text></svg>`;
    const logoBlob = new Blob([shcLogoSvg], { type: 'image/svg+xml' });
    const logoUrl = URL.createObjectURL(logoBlob);

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('app-icon-apple').href = logoUrl;
      document.getElementById('app-icon-fav').href = logoUrl;
    });

    const manifest = {
      name: "신흥정밀 차량 관리자 시스템",
      short_name: "차량관리",
      start_url: "./manager.html",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#0f172a",
      icons: [{
        src: logoUrl,
        sizes: "512x512",
        type: "image/svg+xml",
        purpose: "any maskable"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request)); });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW register failed:', err));
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans select-none">

  <!-- 상단 헤더 -->
  <header class="bg-slate-950 border-b border-slate-800 px-4 py-3 flex justify-between items-center shadow-lg shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center font-black text-white text-xs tracking-tighter italic border border-red-500/50 shadow-md">
        SHC
      </div>
      <div>
        <h1 class="text-sm md:text-base font-black tracking-tight text-white leading-tight">신흥정밀 차량 통합 관리자</h1>
        <p class="text-[10px] text-slate-400 font-bold">담당자/경비실 전용 컨트롤러</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="connection-status" class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold">연결 확인 중...</span>
    </div>
  </header>

  <!-- 앱 설치 안내 카드 영역 (기기/환경 동적 제어) -->
  <div id="pwa-install-wrapper" class="hidden p-3 md:px-6 pb-0 max-w-5xl mx-auto w-full">
    <!-- 1. 스마트 팁 카드 -->
    <div id="smart-tip-card" class="bg-amber-50/10 border border-amber-500/40 rounded-2xl p-3 text-center shadow-lg mb-2">
      <p class="text-amber-300 text-xs font-bold mb-1.5 flex items-center justify-center gap-1">
        💡 담당자 전용 스마트 팁!
      </p>
      <button onclick="installPWA()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2 px-4 rounded-xl shadow-md text-xs md:text-sm flex items-center justify-center gap-2 transition-all">
        <i class="fa-solid fa-download"></i> 클릭 한 번으로 바탕화면에 관리자 앱 설치
      </button>
    </div>

    <!-- 2. 수동 설치 안내 버튼 -->
    <button onclick="toggleManualGuide()" class="w-full bg-blue-950/40 border border-blue-500/40 hover:bg-blue-900/30 text-blue-300 text-xs font-bold py-2 px-3.5 rounded-xl flex items-center justify-between transition-all">
      <span class="flex items-center gap-1.5">
        <i class="fa-mobile-screen-button"></i> 아이폰 / 카카오톡 접속 시 수동 설치 방법
      </span>
      <i id="guide-arrow" class="fa-solid fa-chevron-right text-[10px] transition-transform"></i>
    </button>

    <!-- 수동 설치 방법 상세 내용 -->
    <div id="manual-guide-content" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-3 mt-1.5 text-[11px] text-slate-300 space-y-1">
      <p class="font-bold text-amber-400">📱 아이폰 (Safari)</p>
      <p>하단 중앙 [공유] 버튼 클릭 ➔ [홈 화면에 추가] 선택</p>
      <p class="font-bold text-amber-400 mt-1">💬 카카오톡 내부 브라우저인 경우</p>
      <p>우측 하단 [⋮] 또는 [⋯] 버튼 클릭 ➔ [다른 브라우저로 열기] 후 설치 진행</p>
    </div>
  </div>

  <!-- 메인 콘솔 영역 -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-3 md:p-6 flex flex-col gap-4">

    <!-- 현황 요약 카운터 -->
    <div class="grid grid-cols-3 gap-2 md:gap-4">
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
        <p class="text-[11px] font-bold text-amber-400">입문 대기</p>
        <p id="count-waiting" class="text-xl md:text-3xl font-black text-white mt-0.5">0</p>
      </div>
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
        <p class="text-[11px] font-bold text-blue-400">구역 내 작업중</p>
        <p id="count-working" class="text-xl md:text-3xl font-black text-white mt-0.5">0</p>
      </div>
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
        <p class="text-[11px] font-bold text-emerald-400">출문 완료</p>
        <p id="count-completed" class="text-xl md:text-3xl font-black text-white mt-0.5">0</p>
      </div>
    </div>

    <!-- 차량 관리 리스트 카드 -->
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col shadow-xl overflow-hidden">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
        <h2 class="text-sm md:text-base font-black text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-[#list-check] text-amber-500"></i> 실시간 차량 제어 목록
        </h2>
        <button onclick="fetchManagerData()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
          <i class="fa-solid fa-rotate-right"></i> 새로고침
        </button>
      </div>

      <!-- 리스트 스크롤 영역 -->
      <div id="manager-list" class="flex-1 space-y-2.5 overflow-y-auto no-scrollbar pr-0.5">
        <!-- JS로 동적 생성됨 -->
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i';

    let _supabase = null;
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // --- PWA 기기 및 브라우저 감지 로직 ---
    function checkEnvironmentAndToggleTips() {
      const ua = navigator.userAgent.toLowerCase();
      
      const isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

      const installWrapper = document.getElementById('pwa-install-wrapper');
      const smartTipCard = document.getElementById('smart-tip-card');

      // PC 브라우저이거나 이미 PWA 앱으로 접속한 경우 설치 영역 전체 숨김
      if (!isMobile || isStandalone) {
        if (installWrapper) installWrapper.classList.add('hidden');
        return;
      }

      // 모바일 웹 브라우저 접속 환경일 때만 배너 노출
      if (installWrapper) installWrapper.classList.remove('hidden');

      // 카카오톡/iOS 환경 체크하여 스마트 팁 배너 감춤
      const isKakao = ua.includes('kakaotalk');
      const isIOS = /iphone|ipad|ipod/.test(ua);
      const isOtherInApp = ua.includes('line') || ua.includes('inapp');

      if ((isKakao || isIOS || isOtherInApp) && smartTipCard) {
        smartTipCard.classList.add('hidden');
      }
    }

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('관리자 앱 설치 승인');
          }
          deferredPrompt = null;
        });
      } else {
        toggleManualGuide(true);
      }
    }

    function toggleManualGuide(forceOpen = false) {
      const guide = document.getElementById('manual-guide-content');
      const arrow = document.getElementById('guide-arrow');
      if (forceOpen || guide.classList.contains('hidden')) {
        guide.classList.remove('hidden');
        if (arrow) arrow.classList.add('rotate-90');
      } else {
        guide.classList.add('hidden');
        if (arrow) arrow.classList.remove('rotate-90');
      }
    }

    window.onload = () => {
      checkEnvironmentAndToggleTips();
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const statusBadge = document.getElementById('connection-status');
      if (_supabase) {
        statusBadge.innerText = '관리자 연동 완료';
        statusBadge.className = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold';
      }

      fetchManagerData();
      subscribeRealtime();
    };

    async function fetchManagerData() {
      if (!_supabase) return;

      const today = new Date().toISOString().split('T')[0];
      const start = `${today}T00:00:00`;
      const end = `${today}T23:59:59`;

      const { data, error } = await _supabase
        .from('dock_control')
        .select('*')
        .gte('created_at', start)
        .lte('created_at', end)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Fetch error:', error);
        return;
      }

      renderManagerList(data || []);
    }

    function subscribeRealtime() {
      if (!_supabase) return;
      _supabase
        .channel('public:manager_control')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'dock_control' }, () => {
          fetchManagerData();
        })
        .subscribe();
    }

    function renderManagerList(records) {
      const waiting = records.filter(r => (r.status || '대기중') === '대기중');
      const working = records.filter(r => r.status === '작업중');
      const completed = records.filter(r => r.status === '출문완료');

      document.getElementById('count-waiting').innerText = waiting.length;
      document.getElementById('count-working').innerText = working.length;
      document.getElementById('count-completed').innerText = completed.length;

      const container = document.getElementById('manager-list');
      if (records.length === 0) {
        container.innerHTML = `
          <div class="text-center text-slate-600 py-12 text-sm font-bold">
            오늘 신청된 입문 차량 내역이 없습니다.
          </div>
        `;
        return;
      }

      container.innerHTML = records.map(item => {
        const timeStr = new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        const status = item.status || '대기중';

        let statusBadgeClass = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
        if (status === '작업중') statusBadgeClass = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
        if (status === '출문완료') statusBadgeClass = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';

        return `
          <div class="p-3.5 bg-slate-900 border border-slate-800 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold px-2 py-1 rounded-md border ${statusBadgeClass}">${status}</span>
              <div>
                <p class="text-base font-black text-amber-400 tracking-tight">${item.car_number || '-'}</p>
                <p class="text-xs text-slate-400 font-medium">
                  ${item.driver_name || '-'} | <span class="font-mono">${item.phone_number || '-'}</span>
                </p>
              </div>
            </div>

            <div class="flex items-center justify-between md:justify-end gap-3 border-t md:border-t-0 border-slate-800/80 pt-2 md:pt-0">
              <span class="text-xs font-mono text-slate-500">${timeStr}</span>
              <div class="flex items-center gap-1.5">
                ${status === '대기중' ? `
                  <button onclick="updateStatus('${item.id}', '작업중')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all">
                    입문 승인
                  </button>
                ` : ''}
                ${status === '작업중' ? `
                  <button onclick="updateStatus('${item.id}', '출문완료')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all">
                    출문 완료
                  </button>
                ` : ''}
                <button onclick="deleteRecord('${item.id}')" class="bg-slate-800 hover:bg-rose-900/50 text-slate-400 hover:text-rose-400 text-xs px-2.5 py-1.5 rounded-lg transition-all">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateStatus(id, newStatus) {
      if (!_supabase) return;
      const { error } = await _supabase
        .from('dock_control')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) alert('상태 변경 실패: ' + error.message);
    }

    async function deleteRecord(id) {
      if (!confirm('해당 기록을 삭제하시겠습니까?')) return;
      if (!_supabase) return;

      const { error } = await _supabase
        .from('dock_control')
        .delete()
        .eq('id', id);

      if (error) alert('삭제 실패: ' + error.message);
    }
  </script>
</body>
</html>
