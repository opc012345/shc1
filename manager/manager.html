<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신흥정밀 차량 입문 신청</title>
  
  <!-- PWA 메타태그 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="신흥정밀 입문신청">
  
  <!-- SHC 원형 로고 아이콘 -->
  <link rel="apple-touch-icon" id="app-icon-apple" href="">
  <link rel="icon" id="app-icon-fav" href="">

  <!-- 동적 PWA Manifest 및 Service Worker 자동 생성 스크립트 -->
  <script>
    const shcLogoSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><circle cx="256" cy="256" r="256" fill="#dc2626"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-style="italic" font-size="190">SHC</text></svg>`;
    const logoBlob = new Blob([shcLogoSvg], { type: 'image/svg+xml' });
    const logoUrl = URL.createObjectURL(logoBlob);

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('app-icon-apple').href = logoUrl;
      document.getElementById('app-icon-fav').href = logoUrl;
    });

    const manifest = {
      name: "신흥정밀 차량 입문 신청",
      short_name: "입문신청",
      start_url: "./",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#0f172a",
      icons: [{
        src: logoUrl,
        sizes: "512x512",
        type: "image/svg+xml",
        purpose: "any maskable"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request)); });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW register failed:', err));
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans select-none">

  <!-- 상단 헤더 -->
  <header class="bg-slate-950 border-b border-slate-800 px-4 py-3.5 flex justify-between items-center shadow-lg shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 bg-red-600 rounded-full flex items-center justify-center font-black text-white text-xs tracking-tighter italic border border-red-500/50 shadow-md">
        SHC
      </div>
      <div>
        <h1 class="text-base font-black tracking-tight text-white leading-tight">신흥정밀 차량 입문 시스템</h1>
        <p class="text-[11px] text-slate-400 font-bold">기사용 등록 단말기</p>
      </div>
    </div>
    <span id="connection-status" class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold">연결 확인 중...</span>
  </header>

  <!-- 메인 영역 -->
  <main class="flex-1 max-w-lg w-full mx-auto p-4 flex flex-col justify-between gap-4">

    <!-- 앱 설치 안내 카드 영역 (현장용 동일 적용) -->
    <div id="pwa-install-wrapper" class="hidden w-full">
      <!-- 1. 스마트 팁 카드 -->
      <div id="smart-tip-card" class="bg-amber-50/10 border border-amber-500/40 rounded-2xl p-3.5 text-center shadow-lg mb-2.5">
        <p class="text-amber-300 text-xs font-bold mb-1.5 flex items-center justify-center gap-1">
          💡 기사님 전용 스마트 팁!
        </p>
        <button onclick="installPWA()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 px-4 rounded-xl shadow-md text-xs sm:text-sm flex items-center justify-center gap-2 transition-all">
          <i class="fa-solid fa-download"></i> 클릭 한 번으로 바탕화면에 앱 설치
        </button>
      </div>

      <!-- 2. 수동 설치 안내 버튼 -->
      <button onclick="toggleManualGuide()" class="w-full bg-blue-950/40 border border-blue-500/40 hover:bg-blue-900/30 text-blue-300 text-xs font-bold py-2 px-3.5 rounded-xl flex items-center justify-between transition-all">
        <span class="flex items-center gap-1.5">
          <i class="fa-mobile-screen-button"></i> 아이폰 / 카카오톡 접속 시 수동 설치 방법
        </span>
        <i id="guide-arrow" class="fa-solid fa-chevron-right text-[10px] transition-transform"></i>
      </button>

      <!-- 수동 설치 방법 상세 내용 -->
      <div id="manual-guide-content" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-3 mt-2 text-[11px] text-slate-300 space-y-1.5">
        <p class="font-bold text-amber-400">📱 아이폰 (Safari)</p>
        <p>하단 중앙 [공유] 버튼 클릭 ➔ [홈 화면에 추가] 선택</p>
        <p class="font-bold text-amber-400 mt-1.5">💬 카카오톡 내부 브라우저인 경우</p>
        <p>우측 하단 [⋮] 또는 [⋯] 버튼 클릭 ➔ [다른 브라우저로 열기] 후 설치 진행</p>
      </div>
    </div>

    <!-- 입문 신청 폼 -->
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-2xl flex-1 flex flex-col justify-center">
      <div class="mb-5 text-center">
        <h2 class="text-xl font-black text-white">차량 입문 신청서</h2>
        <p class="text-xs text-slate-400 mt-1">도착하신 기사님은 정보를 입력 후 신청해 주세요.</p>
      </div>

      <form id="entry-form" onsubmit="submitForm(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">차량 번호</label>
          <div class="relative">
            <i class="fa-solid fa-truck absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="text" id="car_number" required placeholder="예: 12가 3456" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-3 text-sm font-bold text-amber-400 placeholder-slate-600 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">운전자 성함</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="text" id="driver_name" required placeholder="홍길동" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-3 text-sm font-bold text-white placeholder-slate-600 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">연락처</label>
          <div class="relative">
            <i class="fa-solid fa-phone absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="tel" id="phone_number" required placeholder="010-0000-0000" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-3 text-sm font-mono font-bold text-white placeholder-slate-600 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <button type="submit" id="submit-btn" 
                class="w-full mt-2 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-black py-3.5 px-4 rounded-xl shadow-lg transition-all text-base flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-paper-plane"></i> 입문 신청하기
        </button>
      </form>
    </div>

    <!-- 하단 유의사항 -->
    <div class="text-center text-[11px] text-slate-500 font-medium">
      신청 완료 후 현황판 대기 순번에 따라 입문 진행됩니다.
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://hlhjmnsgqhysvilltfpf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7e7F7HouzfIP6onOQgY46Q_x81HtP1i';

    let _supabase = null;
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // --- PWA 기기 및 브라우저 감지 로직 ---
    function checkEnvironmentAndToggleTips() {
      const ua = navigator.userAgent.toLowerCase();
      
      const isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

      const installWrapper = document.getElementById('pwa-install-wrapper');
      const smartTipCard = document.getElementById('smart-tip-card');

      // PC 또는 앱(standalone) 환경 접속 시 설치 영역 전체 숨김
      if (!isMobile || isStandalone) {
        if (installWrapper) installWrapper.classList.add('hidden');
        return;
      }

      // 모바일 웹 브라우저 접속 시 노출
      if (installWrapper) installWrapper.classList.remove('hidden');

      // 카카오톡 / iOS 환경에서는 스마트팁 배너 숨김 처리
      const isKakao = ua.includes('kakaotalk');
      const isIOS = /iphone|ipad|ipod/.test(ua);
      const isOtherInApp = ua.includes('line') || ua.includes('inapp');

      if ((isKakao || isIOS || isOtherInApp) && smartTipCard) {
        smartTipCard.classList.add('hidden');
      }
    }

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('앱 설치 완료');
          }
          deferredPrompt = null;
        });
      } else {
        toggleManualGuide(true);
      }
    }

    function toggleManualGuide(forceOpen = false) {
      const guide = document.getElementById('manual-guide-content');
      const arrow = document.getElementById('guide-arrow');
      if (forceOpen || guide.classList.contains('hidden')) {
        guide.classList.remove('hidden');
        if (arrow) arrow.classList.add('rotate-90');
      } else {
        guide.classList.add('hidden');
        if (arrow) arrow.classList.remove('rotate-90');
      }
    }

    window.onload = () => {
      checkEnvironmentAndToggleTips();
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      
      const statusBadge = document.getElementById('connection-status');
      if (_supabase) {
        statusBadge.innerText = '시스템 정상';
        statusBadge.className = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold';
      }
    };

    async function submitForm(e) {
      e.preventDefault();
      if (!_supabase) return;

      const btn = document.getElementById('submit-btn');
      const carNumber = document.getElementById('car_number').value.trim();
      const driverName = document.getElementById('driver_name').value.trim();
      const phoneNumber = document.getElementById('phone_number').value.trim();

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 신청 중...`;

      const { error } = await _supabase
        .from('dock_control')
        .insert([
          { 
            car_number: carNumber, 
            driver_name: driverName, 
            phone_number: phoneNumber,
            status: '대기중' 
          }
        ]);

      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 입문 신청하기`;

      if (error) {
        alert('신청 실패: ' + error.message);
      } else {
        alert('입문 신청이 정상 완료되었습니다!');
        document.getElementById('entry-form').reset();
      }
    }
  </script>
</body>
</html>
