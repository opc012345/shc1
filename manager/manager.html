<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량 입출문 시스템 - 신흥정밀</title>
  
  <!-- PWA 메타태그 및 동적 Manifest 생성 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHC 차량관제">
  
  <link rel="apple-touch-icon" id="app-icon-apple" href="">
  <link rel="icon" id="app-icon-fav" href="">

  <script>
    // 1. SHC 원형 로고 생성
    const shcLogoSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><circle cx="256" cy="256" r="240" fill="#dc2626"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-style="italic" font-weight="900" font-size="200">SHC</text></svg>`;
    const logoBlob = new Blob([shcLogoSvg], { type: 'image/svg+xml' });
    const logoUrl = URL.createObjectURL(logoBlob);

    // 2. 동적 PWA Manifest 인라인 생성 및 주입
    const dynamicManifest = {
      name: "신흥정밀 차량 입출문 (담당자)",
      short_name: "SHC 차량관제",
      start_url: "./manager.html",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#0f172a",
      icons: [
        {
          src: logoUrl,
          sizes: "512x512",
          type: "image/svg+xml",
          purpose: "any maskable"
        }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(dynamicManifest)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);

    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestUrl;
    document.head.appendChild(manifestLink);

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('app-icon-apple').href = logoUrl;
      document.getElementById('app-icon-fav').href = logoUrl;
    });

    // 3. PWA 설치 및 오프라인 등록용 내장 Service Worker 생성
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'shc-manager-v1';
        self.addEventListener('install', (e) => {
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW register failed:', err));
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.10/tailwindcss.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

      }

      tbody#table-body tr {

      tbody#table-body td:nth-child(1)::before { content: "선택"; font-size: 12px; font-weight: 700; color: #64748b; }
      tbody#table-body td:nth-child(2)::before { content: "입문일시"; font-size: 12px; font-weight: 700; color: #64748b; }
      tbody#table-body td:nth-child(3)::before { content: "차량번호"; font-size: 12px; font-weight: 700; color: #64748b; }
      tbody#table-body td:nth-child(4)::before { content: "운전자 성함"; font-size: 12px; font-weight: 700; color: #64748b; }
      tbody#table-body td:nth-child(5)::before { content: "연락처"; font-size: 12px; font-weight: 700; color: #64748b; }
      tbody#table-body td:nth-child(6)::before { content: "상태"; font-size: 12px; font-weight: 700; color: #64748b; }

</head>
<body class="bg-slate-100 min-h-screen text-slate-800" onclick="stopTitleFlash()">

  <!-- 담당자 비밀번호 로그인 모달 -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4">

        <p class="text-xs text-slate-500">관리자 비밀번호를 입력해 주세요.</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">

        <button type="submit" id="login-submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition text-sm shadow-md mt-2">
          로그인
        </button>
      </form>

      <div id="login-error-msg" class="hidden text-xs text-rose-500 font-bold text-center bg-rose-50 p-3 rounded-xl border border-rose-100"></div>
    </div>
  </div>

      <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-red-600 flex items-center justify-center font-black italic text-[11px] sm:text-xs shrink-0 shadow">SHC</div>
      <h1 class="text-sm sm:text-2xl font-black tracking-tight whitespace-nowrap truncate">차량 입출문 시스템 (담당자)</h1>
      <span id="realtime-status" class="bg-amber-500/20 text-amber-400 text-[9px] sm:text-xs px-1.5 sm:px-3 py-0.5 sm:py-1 rounded-full border border-amber-500/30 font-medium whitespace-nowrap shrink-0">연결 중...</span>
    </div>
